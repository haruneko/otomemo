<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作詞補助UI モック v8（判定材料・詞は全部ダミー）</title>
<style>
/* ============================================================
   v8 共通CSS（工程0）。共通クラスは全て c- 接頭辞。
   枚（sheet-*.js）が足してよいのは自分の枚id接頭辞のクラスだけ
   （registerSheet が機械検査する）。共通部品の見た目を変えたい
   ときはここを直さず工程0担当へ依頼すること。
   例外的に接頭辞なしで残す3クラス:
     .frame / .desc / .st … レンダ工程（render.mjs）が参照する枠・
     枠外説明・判定札。この3つは配布スクショで非表示・除去される。
   ============================================================ */
:root{
  --bg:#16181c; --card:#22252b; --line:#33373f; --fg:#e6e8ec; --muted:#9aa0aa;
  --accent:#3a6df0; --mel:#7fc0e8; --fit-red:#e8533f; --fit-yellow:#e0a83c; --hl:#a58ee0;
}
*{box-sizing:border-box}
body{margin:0;padding:28px 24px 60px;background:#0e1013;color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.55}
h1{font-size:20px;margin:0 0 4px}
.c-sub{color:var(--muted);font-size:12px;margin:0 0 26px;max-width:760px}
.frames{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start}
.frame{flex:0 0 auto;width:352px}
.frame.wide{width:760px}
.desc{color:var(--muted);font-size:12px;margin:10px 2px 0;line-height:1.6}
.st{font-size:9px;color:#a99ad0;border:1px dashed #6b5f8a;border-radius:4px;padding:0 4px;white-space:nowrap}
.c-fcap{font-size:15px;margin:0 0 8px;color:var(--fg)}
.c-fcap-no{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;
  font-size:12px;padding:1px 7px;margin-right:8px;vertical-align:2px}

/* ===== 電話枠 ===== */
.c-ph{width:352px;background:var(--bg);border:1px solid #3c414a;border-radius:20px;
  padding:12px 11px 10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.c-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.c-back{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:13px;white-space:nowrap}
.c-ttl{flex:1;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-hbtn{background:var(--card);border:1px solid var(--accent);color:#9db8f7;border-radius:10px;
  padding:5px 10px;font-size:12px;white-space:nowrap}
.c-crumb{flex:1;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-seg{display:flex;gap:4px;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:3px;margin-bottom:8px}
.c-seg span{flex:1;text-align:center;font-size:12px;color:var(--muted);padding:4px 0;border-radius:7px}
.c-seg .c-seg-on{background:var(--accent);color:#fff}
.c-legend{font-size:10.5px;color:var(--muted);margin:0 2px 8px}

/* ===== セクション見出し ===== */
.c-sec{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:12px 0 4px}
.c-sec-kari{border-style:dashed;border-color:#59606c;background:#1c1f25}
.c-grip{color:#5b616c;font-size:12px;letter-spacing:-2px}
.c-sname{font-weight:600;font-size:13px;white-space:nowrap}
.c-sbars{color:var(--muted);font-size:11px}
.c-karichip{font-size:10px;color:#c9b27a;border:1px dashed #8a7a4d;border-radius:6px;padding:0 5px}
.c-samechip{font-size:10px;color:#8fb8a8;border:1px solid #3d5a4f;border-radius:6px;padding:0 6px}
.c-secbtn{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);
  border-radius:7px;padding:1px 7px;white-space:nowrap}
.c-partsep{border-top:1px dashed #454b56;margin:9px 2px 0;height:1px}

/* ===== 句の行 ===== */
.c-ku{position:relative;padding:6px 2px 7px;border-bottom:1px solid #1f2228}
.c-noline{border-bottom:none}
.c-ku-now{outline:1px solid var(--accent);border-radius:8px;background:rgba(58,109,240,.07)}
.c-nowmark{position:absolute;left:-2px;top:4px;color:var(--accent);font-size:10px}
.c-krow{display:flex;gap:6px}
.c-kmain{flex:1;min-width:0}
.c-kside{width:58px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  padding-top:3px;font-size:10px;color:#6d7480}
.c-melo{margin-bottom:3px}
.c-melo svg{display:block}
.c-melo-none{height:12px}
.c-band{fill:rgba(79,168,224,.13);stroke:rgba(79,168,224,.30);stroke-width:.6}
.c-nt{fill:var(--mel)}
.c-ly{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13.5px;min-height:20px}
.c-ly-s{font-size:12px}
.c-imi{font-size:10.5px;color:#7d8697;margin-top:2px}
.c-dslot{display:inline-flex;align-items:center;border:1px dashed #565d69;border-radius:6px;
  padding:2px 8px;color:var(--muted);font-size:11px;margin-left:4px}
.c-fd{display:inline-block;width:7px;height:7px;border-radius:50%}
.c-fd-r{background:var(--fit-red)}
.c-fd-y{background:var(--fit-yellow)}

/* 下段（時間揃えの枠・棒・文字）＝音符矩形と同じ座標式から置く */
.c-fr{position:relative;height:20px;margin-top:1px}
.c-fr .c-kb2{position:absolute;top:0;height:17px;border:1px solid #4d535d;background:#1a1d22;border-radius:3px}
.c-fr .c-bar2{position:absolute;top:8px;height:2px;background:#7a828e;border-radius:1px}
.c-tc{position:absolute;top:2px;text-align:center;font-size:12.5px;white-space:nowrap}
.c-frlab{position:absolute;left:50%;transform:translateX(-50%);top:2px;font-size:10px;color:var(--muted);
  background:rgba(22,24,28,.88);padding:0 6px;border-radius:4px}
.c-fr-after{position:absolute;top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* 印（規則関数からだけ出る。下線=文字側の印） */
.c-mk-r{box-shadow:inset 0 -2px 0 var(--fit-red)}
.c-mk-y{box-shadow:inset 0 -2px 0 var(--fit-yellow)}

/* 点線の区間 */
.c-zone{display:flex;align-items:center;gap:8px;border:1px dashed #565d69;border-radius:9px;
  padding:12px 10px;margin:6px 0;color:var(--muted);font-size:11.5px}
.c-zone-pos{margin-left:auto;color:#6d7480;font-size:10px}

/* 追加操作・断片置き場 */
.c-addrow{display:flex;gap:8px;margin:14px 0 4px}
.c-addbtn{flex:1;text-align:center;border:1px dashed #565d69;border-radius:10px;
  padding:9px 4px;color:var(--muted);font-size:12.5px}
.c-stockhd{color:var(--muted);font-size:11px;margin:16px 2px 2px;border-top:1px solid var(--line);padding-top:10px}
.c-stockku{background:#1a1d22;border:1px solid var(--line);border-radius:9px;padding:7px 8px;border-bottom:1px solid var(--line)}
.c-placebtn{font-size:10.5px;color:#9db8f7;border:1px solid var(--accent);border-radius:7px;padding:1px 7px;margin-left:6px}
.c-stockpos{margin-left:auto;color:#6d7480;font-size:10px}

/* 再生バー */
.c-playbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
.c-pb{min-width:42px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg);padding:0 6px}
.c-pb-play{background:var(--accent);border-color:var(--accent);min-width:50px}
.c-pb-sp{margin-left:auto;border:none;background:none;color:var(--muted);min-width:auto}

/* ===== 範囲の編集画面 ===== */
.c-ghost{opacity:.45}
.c-ghostlbl{font-size:10px;color:var(--muted);margin:8px 2px 0}
.c-refrow{background:#181d1b;border:1px solid #2c3a34;border-radius:9px;padding:6px 8px}
.c-target{border:1px solid var(--accent);border-radius:10px;padding:8px 8px 9px;margin:4px 0;background:#181c25}
.c-fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.c-field{border:1px solid var(--line);border-radius:10px;background:#1b1e24;padding:7px 8px;min-height:86px}
.c-field h4{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:600}
.c-field-fill{font-size:12.5px;color:var(--fg)}
.c-field-empty{font-size:11px;color:#565d69}
.c-field-auto{font-size:10px;color:#6d7480;margin-top:5px}
.c-ops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.c-op{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:5px 9px;font-size:11.5px;color:var(--fg)}
.c-op-main{border-color:var(--accent);color:#9db8f7}

/* 実PianoRoll断片（読み取り専用） */
.c-pr{position:relative;clear:both;border:1px solid var(--line);border-radius:9px;height:104px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#191c21 0 13px,#1d2026 13px 26px)}
.c-pr-bl{position:absolute;top:0;bottom:0;width:1px;background:#2b303a}
.c-pr-n{position:absolute;height:12px;background:var(--mel);border-radius:3px;font-size:9px;
  color:#123;text-align:center;line-height:12px;overflow:hidden}
.c-pr-i{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--fit-yellow);
  color:#222;font-size:8px;line-height:11px;text-align:center;font-style:normal}
.c-pr-i-r{background:var(--fit-red);color:#fff}
.c-pr-empty{height:34px;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:#565d69;font-size:11px}
.c-prcap{font-size:9.5px;color:#6d7480;margin-top:3px}

/* 高低線（読んだときの高低・2値）＋カナ行 */
.c-cmp{position:relative;margin-top:7px}
.c-cmp svg{position:absolute;left:0;top:0}
.c-cmp .c-tc{height:19px;line-height:19px;font-size:13px}
.c-cmp .c-kb2{position:absolute;height:17px;border:1px dashed #565d69;background:#1a1d22;border-radius:3px}
.c-hl-guide{stroke:#3f454e;stroke-width:1;stroke-dasharray:2 3}
.c-hl-line{stroke:var(--hl);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.c-hl-dot{fill:var(--hl)}
.c-hl-phr{stroke:#7a828e;stroke-width:1.5;stroke-linecap:round}
.c-hl-phrknob{fill:#7a828e}
.c-cmplabel{font-size:10px;color:var(--fg);font-weight:600;margin:8px 2px 1px}
.c-cmplsub{font-weight:400;color:var(--muted);margin-left:6px;font-size:9.5px}

/* 候補シート・候補カード */
.c-sheet{border:1px solid var(--line);border-top:2px solid #4a5160;border-radius:14px 14px 12px 12px;
  background:#1d2026;margin-top:12px;padding:9px 9px 8px}
.c-sheet h3{margin:0 0 7px;font-size:12px;color:var(--fg)}
.c-sheet-mode{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}
.c-cand{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:6px 8px;margin-bottom:6px}
.c-cand-w{font-size:14px}
.c-cand-mel{margin:2px 0}
.c-cand-facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.c-fact{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:0 5px}
.c-fact-y{color:var(--fit-yellow);border-color:#6b5a34}
.c-fact-r{color:var(--fit-red);border-color:#6b4034}
.c-cand-dest{font-size:9.5px;color:#6d7480;margin-top:3px}
.c-cgroup{font-size:11px;color:var(--muted);margin:9px 0 5px;border-bottom:1px solid var(--line);padding-bottom:2px}

/* フォーム類 */
.c-reqform,.c-planform{border:1px solid var(--line);border-radius:10px;background:#1b1e24;padding:8px 9px;margin-top:10px}
.c-reqform h3{margin:0 0 6px;font-size:12px;color:var(--fg)}
.c-formrow{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:12px}
.c-formrow label{color:var(--muted);font-size:11px;width:110px;flex:none}
.c-fin{border:1px solid var(--line);background:#15181d;border-radius:6px;padding:2px 7px;
  color:var(--fg);font-size:11.5px;flex:1;min-height:20px}
.c-fin-s{flex:0 0 72px}
.c-fin:empty{color:#565d69}
.c-cond-x{color:#6d7480;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.c-req-empty{font-size:11px;color:var(--muted);border:1px dashed #565d69;border-radius:8px;padding:7px 8px;margin:6px 0}
.c-pop{display:inline-flex;gap:5px;margin-top:6px}
.c-pop span{font-size:10.5px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 7px;color:var(--fg)}
.c-pop-p1{border-color:var(--accent) !important;color:#9db8f7 !important}
.c-inp{display:inline-block;min-width:62px;border:1px solid var(--accent);background:#1b2333;
  border-radius:5px;padding:1px 6px;font-size:12.5px;color:#8a93a6;vertical-align:-2px}
.c-inp i{font-style:normal;color:var(--fg)}

/* 操作割当の注記（データの文字列をそのまま出す） */
.c-opstable{white-space:pre-line;font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;margin:8px 0;line-height:1.7}

/* 枚7用のカード */
.c-cfacts{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}

/* インセット */
.c-inset{background:var(--bg);border:1px solid #3c414a;border-radius:14px;padding:10px 11px;margin-top:14px}
.c-inset h3{margin:0 0 7px;font-size:12px;color:var(--fg)}

/* ===== v8で足した共通クラス ===== */
/* 表記の行（薄い添え表示＝モーラ行を出す切替のとき） */
.c-ly-dim{opacity:.6;font-size:11.5px}
/* 行チップ（欠けの事実。数は機械算出） */
.c-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;align-items:center}
.c-chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:0 6px;white-space:nowrap}
/* 語↔モーラの対応の光り */
.c-glow{background:rgba(122,142,224,.30);border-radius:3px}
/* 表記の欄・読み取り用の表記の欄 */
.c-feedbox{border:1px solid var(--line);border-radius:10px;background:#1b1e24;padding:7px 8px;margin-top:8px}
.c-feedrow{display:flex;gap:7px;align-items:baseline;margin:3px 0;font-size:13px}
.c-feedrow label{width:110px;flex:none;color:var(--muted);font-size:10.5px}
.c-feedtoks{display:inline-flex;flex-wrap:wrap;gap:1px}
.c-ftok{padding:0 1px;border-radius:3px}
.c-feednote{font-size:9.5px;color:#6d7480;margin-top:3px}
/* 読みの出所（機械／手） */
.c-hlsrc{font-size:9.5px;color:#8a93a6;margin:2px 2px 0}
/* 高低の手上書き＝反転した点の輪 */
.c-hl-ring{fill:none;stroke:var(--fit-yellow);stroke-width:1.4}
/* 母音の段（音韻切替の層） */
.c-vrow{position:relative;height:13px;margin-top:1px}
.c-vc{position:absolute;top:0;text-align:center;font-size:9px;color:#6d7480;font-family:ui-monospace,SFMono-Regular,monospace}
.c-vc-rh{color:#7fd6a8;border-bottom:2px solid #3d8f6b}
/* 切替の説明1行 */
.c-switchnote{font-size:10px;color:var(--muted);margin:0 2px 8px}
/* 表示シート（パーツ選択） */
.c-dispsheet{border:1px solid var(--line);border-top:2px solid #4a5160;border-radius:12px;background:#1d2026;padding:8px 9px;margin-top:10px}
.c-dispsheet h3{margin:0 0 6px;font-size:12px;color:var(--fg)}
.c-ds-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.c-ds-sw{margin-left:auto;width:30px;height:16px;border-radius:9px;background:#3a3f49;position:relative;flex:none}
.c-ds-sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#828a96}
.c-ds-on{background:var(--accent)}
.c-ds-on::after{left:auto;right:2px;background:#fff}
.c-ds-reset{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;margin-top:6px;display:inline-block}
/* ヘルプを開いた姿（凡例・割当表はこの中にだけ電話枠内に出てよい） */
.c-helppanel{border:1px solid var(--line);border-radius:12px;background:#1d2026;padding:8px 9px;margin-top:10px}
.c-helppanel h3{margin:0 0 6px;font-size:12px;color:var(--fg)}
.c-help-legend{font-size:10.5px;color:var(--muted);margin:4px 0;line-height:1.6}
/* 枠外の注記（凡例・割当表の移設先）と印の案の注記 */
.c-note{font-size:10.5px;color:var(--muted);margin:10px 2px 0;line-height:1.7;border-top:1px dashed #454b56;padding-top:8px}
.c-marksnote{font-size:9.5px;color:#6d7480;margin:6px 2px 0}
/* 案くらべ区画（枚2「印の決まり」専用） */
.c-cmpbox{border:1px dashed #565d69;border-radius:10px;padding:8px 9px;margin-top:10px}
.c-cmpbox h3{margin:0 0 6px;font-size:11px;color:var(--muted)}
.c-onsuan{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin:4px 0}
.c-onsuan-why{font-size:10px;color:#6d7480}
/* 候補カードの2層目（読み）と作り方（genNote） */
.c-cand-read{font-size:10.5px;color:var(--muted);margin-top:1px}
.c-cand-gen{font-size:9.5px;color:#8a93a6;margin-top:2px}
</style>
</head>
<body>

<h1>作詞補助UI モック v8</h1>
<p class="c-sub">判定材料・詞は全部ダミー（意味の薄い日常語の詰め物。作品ではありません）。
歌詞は2層＝表記（漢字仮名交じり・原本）とモーラ（読み・pyopenjtalk 実走の焼き込み）。
メロの形は矩形（縮小されたピアノロール・横幅=音の長さ・横位置=リズム・縦=相対の音高）。
読みの高低は高い/低いの2値。幅350px級の電話枠・既存アプリの暗色調。
通しの面はパーツ宣言制（枚1の3態）＝凡例・操作の割当は電話枠の外の注記にある。</p>

<div id="frames" class="frames"></div>

<script>
/* ===== data.js ===== */
/* data.js — v8 全表示データの単一定義（自動生成。手で編集しない＝ bake.mjs を変えて再実行）。
 *
 * 構造:
 *   V8DATA.songs.{A,B,C,D} … 曲。A=長い斑の主サンプル・B=メロだけ・C=詞だけ・D=断片だけ。
 *   song.sections[] … {id,name,bars:[始,終]|null,barsText?,kari?,noSing?,sameMelodyAs?,units[]}
 *   units[] … kind:"phrase"（句）| "zone"（まだ何も無い区間）。
 *   句 … {id,bars,hyoki|null,yomiSrc?,notes|{ref:句id}|null,band?,noLyric?,plan?,imi?,sameAs?,accent?,spans?}

    return morasOf(u).map(function (_, i) { return i < ns.length ? ns[i].y : null; });
  }
  /* 空きの枠＝歌詞モーラより後ろの音符（noLyric の句は空きではない） */
  function slotIdxs(u) {
    var ns = notesOf(u) || [];
    if (u.noLyric) return [];
    var m = u.hyoki ? morasOf(u).length : 0;
    var out = [];
    for (var i = m; i < ns.length; i++) out.push(i);
    return out;
  }
  function displayText(u) { return u.hyoki || ""; }
  function barsLabel(u) {
    if (!u.bars) return "";
    return u.bars[0] === u.bars[1] ? u.bars[0] + "小節" : u.bars[0] + "–" + u.bars[1] + "小節";
  }
  /* 印（唯一の導出経路）。opts 省略時は今組み立て中の枚の宣言を使う。
     読みの高低は effHl（手で直した値があればそれ）＝絵と印が食い違わない */
  function marksOf(u, opts) {
    if (!u.accent) return [];
    return M.computeMarks(effHl(u), u.accent.ap, ysOf(u), opts || currentOpts());
  }
  /* 宛先ラベル（候補カード用） */
  function destLabel(u) {
    var sec = section(u.section);
    var sg = D.songs[u.song];
    return "宛先: " + sg.title.replace(/（.*$/, "") + " › " + sec.name + " › " + barsLabel(u).replace("小節", "小節の句");
  }

  /* ================= 印の付与（この2つ以外から規則の印を出さない） ================= */
  function markCell(cell, mk) {
    cell.classList.add(mk.color === "r" ? "c-mk-r" : "c-mk-y");
    cell.setAttribute("data-mk", "rule");
    cell.setAttribute("data-mk-why", mk.why);
  }
  function markNote(noteEl, container, mk, leftPx, topPx) {
    noteEl.classList.add(mk.color === "r" ? "c-mk-r" : "c-mk-y");
    noteEl.setAttribute("data-mk", "rule");
    noteEl.setAttribute("data-mk-why", mk.why);
    var dot = el("i", "c-pr-i" + (mk.color === "r" ? " c-pr-i-r" : ""), "i");
    dot.setAttribute("data-mk", "rule");
    dot.style.left = px(leftPx) + "px";
    dot.style.top = px(Math.max(0, topPx - 13)) + "px";
    container.appendChild(dot);
  }

  /* ================= 枚の登録と描画 ================= */
  var sheets = [];
  var _current = null;
  function currentOpts() {
    return (_current && _current.marksOpts) || M.DEFAULT_OPTS;
  }
  var CLASS_RE = /\.(-?[_a-zA-Z][-_a-zA-Z0-9]*)/g;
  function registerSheet(sh) {
    if (!sh || !sh.id || !/^[a-z][a-z0-9]*$/.test(sh.id)) throw new Error("枚idは英小文字+数字: " + (sh && sh.id));
    if (sheets.some(function (s) { return s.id === sh.id; })) throw new Error("枚id重複: " + sh.id);
    if (typeof sh.build !== "function") throw new Error("build が無い: " + sh.id);
    if (!sh.marksOpts || M.OPTS.flatPair.indexOf(sh.marksOpts.flatPair) < 0 ||
        M.OPTS.yellowUse.indexOf(sh.marksOpts.yellowUse) < 0) {
      throw new Error("枚 " + sh.id + ": marksOpts（flatPair:ア|イ, yellowUse:A|B）の宣言が必要");
    }
    if (sh.css) {
      var m2, bad = [];
      CLASS_RE.lastIndex = 0;
      while ((m2 = CLASS_RE.exec(sh.css))) {
        if (m2[1].indexOf(sh.id + "-") !== 0) bad.push("." + m2[1]);
      }
      if (bad.length) throw new Error("枚 " + sh.id + " のCSSに接頭辞違反のクラス: " + bad.join(" ") +
        "（この枚のクラスは全て " + sh.id + "- で始める。共通部品の見た目を変えたいときは工程0へ依頼）");
    }
    sheets.push(sh);
  }
  function renderAll(container) {
    sheets.sort(function (a, b) { return (a.no || 99) - (b.no || 99); });
    sheets.forEach(function (sh) {
      var fr = el("div", "frame" + (sh.wide ? " wide" : ""));
      fr.setAttribute("data-sheet", sh.id);
      if (sh.demo) fr.setAttribute("data-demo", "1");
      fr.setAttribute("data-marks-opts", JSON.stringify(sh.marksOpts));
      var h = el("h2", "c-fcap");
      var no = el("span", "c-fcap-no", String(sh.no != null ? sh.no : "?"));
      h.appendChild(no);
      h.appendChild(document.createTextNode(sh.title || sh.id));
      fr.appendChild(h);
      if (sh.css) {
        var st = document.createElement("style");
        st.textContent = sh.css;
        fr.appendChild(st);
      }
      var body = el("div");
      fr.appendChild(body);
      _current = sh;
      try { sh.build(body); } finally { _current = null; }
      /* 印の使用案の枠外注記（機械生成・検証8-6が照合） */
      var mn = el("div", "c-marksnote",
        "この枚の印の案: " + sh.marksOpts.flatPair + "＋" + sh.marksOpts.yellowUse +
        "（枠内に案くらべ区画があればそこだけ例外）");
      mn.setAttribute("data-marksnote", "1");
      fr.appendChild(mn);
      container.appendChild(fr);
    });
  }

  /* ================= 部品 ================= */

  /** 電話枠。opts: {title, crumb, tab:"素"|"音韻"|"イントネーション"|null, headBtn, playbar:true}
   *  v8: 凡例（legend）は電話枠の中に置けない＝枠外の legendNote() か help の中だけ（計画§3-2）。 */
  function phone(opts, children) {
    if (opts.legend) throw new Error("v8では電話枠の中に凡例を置かない（legendNote() を枠外に置くか helpPanel の中に）");
    var ph2 = el("div", "c-ph");
    var hd = el("div", "c-hd");
    hd.appendChild(el("span", "c-back", "← 戻る"));
    if (opts.crumb) {
      var cr = el("span", "c-crumb");
      cr.textContent = opts.crumb;
      hd.appendChild(cr);
    } else {
      hd.appendChild(el("span", "c-ttl", opts.title || ""));
    }
    if (opts.headBtn) hd.appendChild(el("span", "c-hbtn", opts.headBtn));
    ph2.appendChild(hd);
    if (opts.tab !== undefined && opts.tab !== null) {
      var seg = el("div", "c-seg");
      ["素", "音韻", "イントネーション"].forEach(function (t) {
        seg.appendChild(el("span", t === opts.tab ? "c-seg-on" : "", t));
      });
      ph2.appendChild(seg);
    }
    (children || []).forEach(function (c) { ph2.appendChild(c); });
    if (opts.playbar !== false) ph2.appendChild(playbar());
    return ph2;
  }

  /** 再生バー */
  function playbar() {
    var pb = el("div", "c-playbar");
    pb.appendChild(el("span", "c-pb", "|◀"));
    pb.appendChild(el("span", "c-pb c-pb-play", "▶"));
    pb.appendChild(el("span", "c-pb", "⟳"));
    pb.appendChild(el("span", "c-pb c-pb-sp", "1:1"));
    pb.appendChild(el("span", "c-pb", "◀)))"));
    return tag(pb, "playbar");
  }

  /** 凡例の既定文（枠外の注記・helpPanel の中で使う） */
  function legendText(kind) {
    if (kind === "plain") return "行の右端の●=印のある箇所あり（赤=アクセント逆行・黄=注意）。チップ=欠けの事実（詞の空きN音・あとN音・字余りN・メロの空き）。メロの帯・空きマスは「表示」で出せる";
    if (kind === "switch") return "行の右端の●=印のある箇所あり・文字の下線=その印の場所（赤=アクセント逆行・黄=注意・印なし=指摘なし。既存の韻律チェックと同じ作法）。チップ=欠けの事実（詞の空きN音・あとN音・字余りN・メロの空き）";
    if (kind === "into") return "切替（音韻・イントネーション）中は文字の下線でも同じ印が出る（赤=アクセント逆行・黄=注意・印なし=指摘なし。既存の韻律チェックと同じ作法）";
    return kind;
  }
  /** 枠外の凡例注記（電話枠の外に置く） */
  function legendNote(kind) {
    var d = el("div", "c-note", "凡例: " + legendText(kind || "plain"));
    d.setAttribute("data-legend-note", "1");
    return d;
  }

  /** 通しの面の操作の割当の注記（データの正準文字列をそのまま出す。書き換え禁止）。
   *  v8では電話枠の外（枠外注記）か helpPanel の中にだけ置く（計画§3-2・検証8-7）。 */
  function opsTableNote() {
    var d = el("div", "c-opstable");
    d.setAttribute("data-ops-table", "1");
    d.textContent = D.opsTableText;
    return d;
  }

  /** ヘルプを開いた姿（枚1付記用）。凡例・割当表はこの中にだけ電話枠内に出てよい。 */
  function helpPanel() {
    var d = el("div", "c-helppanel");
    d.setAttribute("data-help", "1");
    tag(d, "help");
    d.appendChild(el("h3", null, "ヘルプ"));
    d.appendChild(el("div", "c-help-legend", legendText("plain")));
    d.appendChild(el("div", "c-help-legend", legendText("into")));
    d.appendChild(opsTableNote());
    return d;
  }

  /** 切替の説明1行（枚2・3の層の一部） */
  function switchNote(kind) {
    if (!wants("switchNote")) throw new Error("switchNote はこのパーツ宣言に無い");
    var t = kind === "onin"
      ? "各音の下の小さい字=読みの母音・下線=句のおわり2音の母音が同じ句どうし（韻）"
      : "文字の下線=印（赤=読みの高低とメロの上下が逆・黄=注意）・線=読んだときの高低（上=高い/下=低いの2値）";
    return tag(el("div", "c-switchnote", t), "switchNote");
  }

  /** 表示シート（6項目＋既定に戻す）。onMap: 上書きしたい {ラベル:bool}（省略=態Aの既定） */
  function dispSheet(onMap) {
    if (!wants("dispSheet")) throw new Error("dispSheet はこのパーツ宣言に無い");
    var d = el("div", "c-dispsheet");
    tag(d, "dispSheet");
    d.appendChild(el("h3", null, "表示"));
    DISPLAY_ITEMS.forEach(function (it) {
      var on = onMap && Object.prototype.hasOwnProperty.call(onMap, it.label) ? onMap[it.label] : it.on;
      var row = el("div", "c-ds-row");
      row.appendChild(el("span", null, it.label));
      row.appendChild(el("span", "c-ds-sw" + (on ? " c-ds-on" : "")));
      d.appendChild(row);
    });
    d.appendChild(el("span", "c-ds-reset", "既定に戻す"));
    return d;
  }

  /** 縮小ピアノロール（メロの帯）。stateId の音符列（ref解決込み）を描く。
   *  opts: {width, vw, ghost} */
  function melo(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ns = notesOf(u);
    if (!ns) return meloNone();
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var w = opts.width || vw;
    var h = Math.round(LAYOUT.MELO_H * (w / vw));
    var wrap = el("div", "c-melo" + (opts.ghost ? " c-ghost" : ""));
    tag(wrap, "meloBand");
    wrap.style.height = h + "px";
    var svg = sv("svg", { width: w, height: h, viewBox: "0 0 " + vw + " " + LAYOUT.MELO_H });
    var bands = u.band || (u.base && phrase(u.base).band) || [[0, vw]];
    bands.forEach(function (b) {
      svg.appendChild(sv("rect", { class: "c-band", x: b[0], y: 3, width: b[1], height: 18, rx: 4 }));
    });
    ns.forEach(function (n, i) {
      var r = sv("rect", { class: "c-nt", x: n.x, y: n.y, width: n.w, height: LAYOUT.MELO_NOTE_H, rx: 1.5 });
      r.setAttribute("data-nr", stateId + ":" + i);
      svg.appendChild(r);
    });
    wrap.appendChild(svg);
    return wrap;
  }
  /** メロ未定のときの薄い余白（帯なし） */
  function meloNone() { return el("div", "c-melo c-melo-none"); }

  /** 表記の行（読み物として読める歌詞テキスト）。チップは rowChips が別に出す。 */
  function hyokiLine(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ly = el("div", "c-ly" + (opts.dim ? " c-ly-dim" : ""));
    tag(ly, "hyoki");
    if (u.hyoki) {
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + stateId);
      ly.appendChild(sp);
    }
    return ly;
  }

  /** 予定チップ（点線の小箱）。表示文字列は予定の欄から機械結合 */
  function planChipText(plan) {
    var parts = [];
    if (plan.memo) parts.push(plan.memo);
    if (plan.onsu) parts.push(plan.onsu);
    if (plan.bars) parts.push(plan.bars + "小節");
    if (plan.hl) parts.push("読み " + plan.hl);
    return parts.join("・");
  }
  function planChip(plan) {
    var c = el("span", "c-dslot", planChipText(plan));
    c.setAttribute("data-src", "plan:" + plan.id);
    return c;
  }

  /** 行チップの機械算出（計画§1-4・§3-2。数はすべて機械算出＝検証8-3が再計算照合）。
   *  返り値: [{kind, text}]。予定チップは含まない（rowChips が planChip を併置する）。 */
  function rowChipDefs(u) {
    var ns = notesOf(u);
    var out = [];
    if (u.noLyric) {
      /* §3-4の行チップ列挙に「詞なし」は無いが、意図して詞を付けない事実が態Aで
         見えなくなるためチップで出す（計画への差し戻し候補として報告に明記） */
      out.push({ kind: "nolyric", text: "詞なし" });
      return out;
    }
    if (ns && !u.hyoki) out.push({ kind: "lyricgap", text: "詞の空き" + ns.length + "音" });
    if (ns && u.hyoki) {
      var d = ns.length - morasOf(u).length;
      if (d > 0) out.push({ kind: "rest", text: "あと" + d + "音" });
      if (d < 0) out.push({ kind: "overflow", text: "字余り" + (-d) });
    }
    if (!ns && u.hyoki) out.push({ kind: "melogap", text: "メロの空き" });
    return out;
  }
  function rowChips(stateId) {
    var u = state(stateId);
    var defs = rowChipDefs(u);
    if (!defs.length && !u.plan) return null;
    var w = el("div", "c-chips");
    tag(w, "chips");
    w.setAttribute("data-phrase", stateId);
    defs.forEach(function (c) {
      var e = el("span", "c-chip", c.text);
      e.setAttribute("data-calc", "chip:" + stateId + ":" + c.kind);
      w.appendChild(e);
    });
    if (u.plan) w.appendChild(planChip(u.plan));
    return w;
  }

  /** 時間揃えの下段（.c-fr）。mode:
   *   "slots"  … 空きの枠だけ（パーツ=emptyCells）
   *   "bar"    … 詞なしの横棒（範囲の編集画面用。通しの面の態では「詞なし」チップが担う）
   *   "kana"   … モーラ行＝文字を音符の時間位置に置く（パーツ=moraRow）。印は規則から。
   *  区画の x位置・幅は音符の時間データ（x,w）から計算する＝帯の表示と独立（計画§3-1）。
   *  opts: {width, vw, padL, marksOpts, glowSpan}
   *  実PianoRoll断片の直下に置くときは prMoraRow() を使う（スケールと左端を断片に合わせる）。 */
  function timeRow(stateId, mode, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ns = notesOf(u) || [];
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var w = opts.width || vw;
    var f = w / vw;
    var padL = opts.padL || 0;
    var fr = el("div", "c-fr");
    fr.setAttribute("data-phrase", stateId);
    fr.setAttribute("data-vw", String(vw));
    fr.setAttribute("data-w", String(w));
    fr.setAttribute("data-padl", String(padL));
    if (mode === "kana") tag(fr, "moraRow");
    if (mode === "slots") tag(fr, "emptyCells");
    if (mode === "bar") {
      ns.forEach(function (n, i) {
        var b = el("span", "c-bar2");
        b.style.left = px(padL + n.x * f) + "px";
        b.style.width = px(n.w * f) + "px";
        b.setAttribute("data-nc", stateId + ":" + i);
        fr.appendChild(b);
      });
      fr.appendChild(el("span", "c-frlab", "詞なし"));
      return fr;
    }
    var moras = morasOf(u);
    var mks = {};
    if (mode === "kana") marksOf(u, opts.marksOpts).forEach(function (mk) { mks[mk.i] = mk; });
    /* 案を部品単位で上書きした場合は宣言を要素に残す（案くらべ区画専用。検証8-6が
       compareBox の外での上書きを違反にする） */
    if (opts.marksOpts) fr.setAttribute("data-marks-opts", JSON.stringify(opts.marksOpts));
    var glow = null;
    if (opts.glowSpan != null && u.spans && u.spans[opts.glowSpan]) glow = u.spans[opts.glowSpan];
    ns.forEach(function (n, i) {
      if (i < moras.length && mode === "kana") {
        var tc = el("span", "c-tc", moras[i]);
        tc.style.left = px(padL + n.x * f) + "px";
        tc.style.width = px(n.w * f) + "px";
        tc.setAttribute("data-nc", stateId + ":" + i);
        tc.setAttribute("data-src", "mora:" + stateId + ":" + i);
        if (glow && i >= glow.m0 && i < glow.m1) { tc.classList.add("c-glow"); tc.setAttribute("data-glow", "1"); }
        if (mks[i]) markCell(tc, mks[i]);
        fr.appendChild(tc);
      } else if (i >= moras.length && !u.noLyric && (mode === "slots" || wants("emptyCells"))) {
        var kb = el("span", "c-kb2");
        kb.style.left = px(padL + n.x * f) + "px";
        kb.style.width = px(n.w * f) + "px";
        kb.setAttribute("data-nc", stateId + ":" + i);
        if (mode === "kana") tag(kb, "emptyCells");
        fr.appendChild(kb);
      }
    });
    /* 音符よりモーラが多い＝音符なしのモーラは末尾に灰色で置く（計画§1-4）。
       行の右端を越えるときは2段目へ折り返す（文字を隠さない・枠からはみ出さない） */
    if (mode === "kana" && moras.length > ns.length && ns.length) {
      var lastN = ns[ns.length - 1];
      var afterText = moras.slice(ns.length).join("");
      var after = el("span", "c-fr-after", afterText);
      after.setAttribute("data-src", "lyricafter:" + stateId);
      var afterLeft = padL + (lastN.x + lastN.w) * f + 10;
      var est = afterText.length * 13 + 4; // 文字幅の見積もり(px)
      if (afterLeft + est > padL + w) {
        after.style.left = px(padL) + "px";
        after.style.top = LAYOUT.FR_H + "px";
        fr.style.height = (LAYOUT.FR_H * 2) + "px";
        fr.setAttribute("data-wrap", "1");
      } else {
        after.style.left = px(afterLeft) + "px";
      }
      fr.appendChild(after);
    }
    return fr;
  }

  /** 実PianoRoll断片の直下に置くモーラ行（範囲の編集画面用）。
   *  スケールと左端を断片（prFragment）の音符矩形に合わせる＝縦揃えの検証対象。
   *  字余り（音符なしのモーラ）は末尾に灰色で出る（timeRow "kana" と同じ）。 */
  function prMoraRow(stateId, opts) {
    opts = opts || {};
    return timeRow(stateId, "kana", Object.assign({
      width: LAYOUT.PR_INNER_W, vw: LAYOUT.TIME_W, padL: LAYOUT.PR_PAD_L + LAYOUT.PR_BORDER,
    }, opts));
  }

  /** 母音の段（音韻切替の層・時間揃え）。かな→母音は機械の表から導く。
   *  opts: {width, vw, rhymeLast:N（おわりN音に韻の下線）} */
  var VMAP = {
    a: "あかがさざただなはばぱまやらわゃアカガサザタダナハバパマヤラワャ",
    i: "いきぎしじちぢにひびぴみりイキギシジチヂニヒビピミリ",
    u: "うくぐすずつづぬふぶぷむゆるゅウクグスズツヅヌフブプムユルュ",
    e: "えけげせぜてでねへべぺめれエケゲセゼテデネヘベペメレ",
    o: "おこごそぞとどのほぼぽもよろをょオコゴソゾトドノホボポモヨロヲョ",
  };
  function vowelOf(mora) {
    var c = mora[mora.length - 1];
    if (c === "ん" || c === "ン") return "ん";
    if (c === "っ" || c === "ッ") return "っ";
    if (c === "ー") return "ー";
    for (var k in VMAP) if (VMAP[k].indexOf(c) >= 0) return k;
    return "?";
  }
  function vowelRow(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ns = notesOf(u) || [];
    if (!u.accent) throw new Error("vowelRow: accent が無い: " + stateId);
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var w = opts.width || vw;
    var f = w / vw;
    var vr = el("div", "c-vrow");
    tag(vr, "vowelRow");
    vr.setAttribute("data-phrase", stateId);
    vr.setAttribute("data-vw", String(vw));
    vr.setAttribute("data-w", String(w));
    var moras = morasOf(u);
    var m = moras.length;
    moras.forEach(function (mo, i) {
      if (i >= ns.length) return; // 時間の基準が無いモーラは段に出さない
      var s = el("span", "c-vc" + (opts.rhymeLast && i >= m - opts.rhymeLast ? " c-vc-rh" : ""), vowelOf(mo));
      s.style.left = px(ns[i].x * f) + "px";
      s.style.width = px(ns[i].w * f) + "px";
      s.setAttribute("data-nc", stateId + ":" + i);
      vr.appendChild(s);
    });
    return vr;
  }

  /** 通しの面の句の一行（パーツ宣言制）。throughPane の中でだけ使える。
   *  出すものは宣言（activeSet）が決める＝枚ごとの判断をさせない。
   *  opts: {now:true(再生中の強調), vowel:{rhymeLast:N}} */
  function phraseRow(stateId, opts) {
    opts = opts || {};
    if (!activeSet()) throw new Error("phraseRow は throughPane(宣言名, ...) の中でだけ使う（計画§3-4）");
    var u = state(stateId);
    var ns = notesOf(u);
    var row = el("div", "c-ku" + (opts.now ? " c-ku-now" : ""));
    row.setAttribute("data-phrase", stateId);
    if (opts.now) row.appendChild(el("span", "c-nowmark", "▶"));
    var krow = el("div", "c-krow");
    var main = el("div", "c-kmain");
    /* モーラ行を出す切替では表記の行を薄く添える（行構成は裁定待ち5＝仰ぎ直しの対象） */
    var hasMora = wants("moraRow") && u.hyoki && ns && u.accent;
    if (wants("meloBand") && ns) main.appendChild(melo(stateId));
    if (wants("hyoki") && u.hyoki) main.appendChild(hyokiLine(stateId, { dim: hasMora }));
    if (hasMora) main.appendChild(timeRow(stateId, "kana"));
    if (wants("vowelRow") && u.hyoki && ns && u.accent) main.appendChild(vowelRow(stateId, opts.vowel));
    if (wants("hlLine") && u.hyoki && ns && u.accent) main.appendChild(hlLineRow(stateId));
    if (wants("emptyCells") && ns && !hasMora && slotIdxs(u).length) main.appendChild(timeRow(stateId, "slots"));
    if (wants("chips")) {
      var ch = rowChips(stateId);
      if (ch) main.appendChild(ch);
    }
    krow.appendChild(main);
    var side = el("div", "c-kside");
    if (wants("dot")) {
      var mks = marksOf(u);
      if (mks.some(function (m) { return m.color === "r"; })) {
        var fd = el("span", "c-fd c-fd-r"); fd.setAttribute("data-mk", "rule"); tag(fd, "dot"); side.appendChild(fd);
      } else if (mks.length) {
        var fd2 = el("span", "c-fd c-fd-y"); fd2.setAttribute("data-mk", "rule"); tag(fd2, "dot"); side.appendChild(fd2);
      }
    }
    if (wants("barNo") && u.bars) side.appendChild(tag(el("span", null, barsLabel(u)), "barNo"));
    krow.appendChild(side);
    row.appendChild(krow);
    if (wants("imi") && u.imi) {
      var im = el("div", "c-imi", u.imi);
      im.setAttribute("data-src", "imi:" + stateId);
      tag(im, "imi");
      row.appendChild(im);
    }
    return row;
  }

  /** セクション見出し（仮チップ・確定にする・同じメロチップはデータから機械で出す） */
  function sectionHead(secId) {
    var s = section(secId);
    var head = el("div", "c-sec" + (s.kari ? " c-sec-kari" : ""));
    tag(head, "secHead");
    head.setAttribute("data-section", secId);
    head.appendChild(el("span", "c-grip", "⋮⋮"));
    head.appendChild(el("span", "c-sname", s.name));
    if (s.kari) head.appendChild(el("span", "c-karichip", "仮"));
    var lenTxt = s.barsText || (s.bars ? (s.bars[1] - s.bars[0] + 1) + "小節" : "");
    if (s.noSing) lenTxt += "（歌なし）";
    head.appendChild(el("span", "c-sbars", lenTxt));
    if (s.sameMelodyAs) {
      var ref = section(s.sameMelodyAs);
      var chip = el("span", "c-samechip", "同じメロ: " + ref.name);
      chip.setAttribute("data-src", "same:" + secId);
      head.appendChild(chip);
    }
    if (s.kari) head.appendChild(el("span", "c-secbtn", "確定にする"));
    return head;
  }

  /** まだ何も無い区間（点線）。予定があれば予定チップを併記。 */
  function zoneRow(zoneId) {

    zn.appendChild(el("span", null, "まだ何も無い区間"));

  /** まだ並びに入れていないもの（断片）の一行。帯はパーツ宣言に従う（態Aでは出ない） */
  function stockRow(stockId) {

  function stockHead() { return tag(el("div", "c-stockhd", "まだ並びに入れていないもの"), "stock"); }

  /** 追加操作の行（＋セクションを足す 等）。labels: 文字列配列 */
  function addRow(labels) {
    var r = el("div", "c-addrow");

  /* ---------------- 範囲の編集画面まわり（パーツ選択の対象外＝常に全部出す） ---------------- */

  /** 表記の欄（＋読み取り用の表記の欄）。範囲の編集画面用。
   *  - yomiSrc の無い句: 表記の欄がそのまま読み取りの元（feed）＝語のトークンに分かれ、
   *    glowSpan で語↔モーラの光りが出せる。
   *  - yomiSrc のある句: 対応の光りは読み取り用の表記の欄にだけ出る。表記の欄は光らない
   *    （別文字列の間の対応を取る経路は無い＝実測に基づく制限。計画§1-2。一言も出す）。
   *  opts: {glowSpan} */
  function feedRows(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var box = el("div", "c-feedbox");
    box.setAttribute("data-phrase", stateId);
    function tokenRow(labelText, spans) {
      var row = el("div", "c-feedrow");
      row.appendChild(el("label", null, labelText));
      var wrap = el("span", "c-feedtoks");
      spans.forEach(function (sp2, k) {
        var t = el("span", "c-ftok", sp2.s);
        t.setAttribute("data-src", "span:" + stateId + ":" + k);
        if (opts.glowSpan === k) { t.classList.add("c-glow"); t.setAttribute("data-glow", "1"); }
        wrap.appendChild(t);
      });
      row.appendChild(wrap);
      return row;
    }
    if (!u.yomiSrc) {
      box.appendChild(tokenRow("表記", u.spans || []));
    } else {
      var row1 = el("div", "c-feedrow");
      row1.appendChild(el("label", null, "表記"));
      var pl = el("span", null, u.hyoki);
      pl.setAttribute("data-src", "lyric:" + stateId);
      row1.appendChild(pl);
      box.appendChild(row1);
      box.appendChild(tokenRow("読み取り用の表記", u.spans || []));
      box.appendChild(el("div", "c-feednote", SPAN_NOTE));
    }
    return box;
  }

  /** 読みの出所の表示（機械の読み取り／手で直した）。読みの高低・句切れを出す絵に添える。 */
  function hlSource(stateId) {
    var u = state(stateId);
    var t = u.hand ? "出所: 手で直した（もとは機械の読み取り）" : "出所: 機械の読み取り（accent.py）";
    var d = el("div", "c-hlsrc", t);
    d.setAttribute("data-calc", "hlsrc:" + stateId);
    return d;
  }

  /** 実PianoRoll断片（読み取り専用）。音符・カナ・印を LAYOUT の式から描く。
   *  opts: {marksOpts, glowSpan} */
  function prFragment(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ns = notesOf(u);
    if (!ns) {
      var e = el("div", "c-pr-empty", "まだメロがありません");
      e.setAttribute("data-phrase", stateId);
      return e;
    }
    var moras = morasOf(u);
    var box = el("div", "c-pr");
    box.setAttribute("data-phrase", stateId);
    if (opts.marksOpts) box.setAttribute("data-marks-opts", JSON.stringify(opts.marksOpts));
    var sx = LAYOUT.PR_INNER_W / LAYOUT.TIME_W;
    var ystep = (LAYOUT.PR_H - LAYOUT.PR_PAD_T - LAYOUT.PR_PAD_B - LAYOUT.PR_NOTE_H) / LAYOUT.PITCH_RANGE;
    var nbars = u.bars ? (u.bars[1] - u.bars[0] + 1) : 2;
    for (var b = 1; b < nbars; b++) {
      var bl = el("div", "c-pr-bl");
      bl.style.left = px(LAYOUT.PR_PAD_L + (LAYOUT.PR_INNER_W * b) / nbars) + "px";
      box.appendChild(bl);
    }
    var mks = {};
    marksOf(u, opts.marksOpts).forEach(function (mk) { mks[mk.i] = mk; });
    var glow = null;
    if (opts.glowSpan != null && u.spans && u.spans[opts.glowSpan]) glow = u.spans[opts.glowSpan];
    ns.forEach(function (n, i) {
      var left = LAYOUT.PR_PAD_L + n.x * sx;
      var top = LAYOUT.PR_PAD_T + n.y * ystep;
      var ne = el("div", "c-pr-n", i < moras.length ? moras[i] : "");
      if (i < moras.length) ne.setAttribute("data-src", "mora:" + stateId + ":" + i);
      ne.setAttribute("data-nr", stateId + ":" + i);
      ne.style.left = px(left) + "px";
      ne.style.top = px(top) + "px";
      ne.style.width = px(n.w * sx) + "px";
      if (glow && i >= glow.m0 && i < glow.m1) { ne.classList.add("c-glow"); ne.setAttribute("data-glow", "1"); }
      box.appendChild(ne);
      if (mks[i]) markNote(ne, box, mks[i], left + n.w * sx / 2 - 5, top);
    });
    return box;
  }
  function prCaption() {
    return el("div", "c-prcap", "実メロの断片（読み取り専用・赤/黄の印は音符側）。タップするとピアノロールが開きます");
  }

  /** 高低線（読んだときの高低・2値）＋カナ行。範囲の編集画面用。
   *  hand（高低を手で直した状態）は反転したモーラの点に輪が付く（出所は hlSource で出す）。
   *  opts: {glowSpan, marksOpts, kana:false(カナ行なし), width, vw, padL} */
  function hlRow(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var ns = notesOf(u);
    var moras = morasOf(u);
    var acc = u.accent;
    var hl = effHl(u);
    var flipped = {};
    if (u.hand) u.hand.flipped.forEach(function (i) { flipped[i] = true; });
    var padL = opts.padL != null ? opts.padL : LAYOUT.PR_PAD_L;
    var W = opts.width || LAYOUT.PR_INNER_W;
    var vw = opts.vw || LAYOUT.TIME_W;
    var withKana = opts.kana !== false;
    var wrap = el("div", "c-cmp");
    wrap.setAttribute("data-phrase", stateId);
    wrap.setAttribute("data-vw", String(vw));
    wrap.setAttribute("data-w", String(W));
    wrap.setAttribute("data-padl", String(padL));
    wrap.style.height = (LAYOUT.HL_GRAPH + 2 + (withKana ? LAYOUT.HL_KANA_H : 0)) + "px";
    var svg = sv("svg", { width: W + padL, height: LAYOUT.HL_GRAPH,
      viewBox: "0 0 " + (W + padL) + " " + LAYOUT.HL_GRAPH });
    svg.setAttribute("data-hl", stateId);
    wrap.appendChild(svg);
    var sx = W / vw;
    var glow = null;
    if (opts.glowSpan != null && u.spans && u.spans[opts.glowSpan]) glow = u.spans[opts.glowSpan];
    /* 各モーラの区画 [left,width] を音符（あれば）か等間隔（なければ）から決める */
    var cells = [];
    for (var i = 0; i < moras.length; i++) {
      if (ns && i < ns.length) {
        cells.push([padL + ns[i].x * sx, ns[i].w * sx]);
      } else if (!ns) {
        var cw = Math.floor(W / Math.max(1, moras.length));
        cells.push([padL + i * cw, cw - 2]);
      } else {
        cells.push(null); // 音符なしのモーラは高低線に出さない（時間の基準が無い）
      }
    }
    if (acc) {
      cells.forEach(function (c) {
        if (!c) return;
        var cx = c[0] + c[1] / 2;
        svg.appendChild(sv("line", { class: "c-hl-guide", x1: cx, y1: LAYOUT.HL_PHR_Y + 5, x2: cx, y2: LAYOUT.HL_GRAPH - 2 }));
      });
      var i0 = 0;
      while (i0 < moras.length) {
        var apv = acc.ap[i0];
        var iEnd = i0;
        while (iEnd + 1 < moras.length && acc.ap[iEnd + 1] === apv) iEnd++;
        var pts = [];
        for (var j = i0; j <= iEnd; j++) {
          if (!cells[j]) continue;
          var cx2 = cells[j][0] + cells[j][1] / 2;
          var cy = hl[j] ? LAYOUT.HL_HI : LAYOUT.HL_LO;
          pts.push([cx2, cy, j]);
        }
        if (pts.length) {
          svg.appendChild(sv("polyline", { class: "c-hl-line",
            points: pts.map(function (p) { return px(p[0]) + "," + p[1]; }).join(" ") }));
          pts.forEach(function (p) {
            svg.appendChild(sv("circle", { class: "c-hl-dot", cx: px(p[0]), cy: p[1], r: LAYOUT.HL_DOT }));
            if (flipped[p[2]]) {
              var ring = sv("circle", { class: "c-hl-ring", cx: px(p[0]), cy: p[1], r: LAYOUT.HL_DOT + 2.4 });
              ring.setAttribute("data-hand", "1");
              svg.appendChild(ring);
            }
          });
          var xa = cells[i0] ? cells[i0][0] + 2 : pts[0][0];
          var cEnd = cells[iEnd] || cells[i0];
          var xb = cEnd ? cEnd[0] + cEnd[1] - 2 : pts[pts.length - 1][0];
          svg.appendChild(sv("line", { class: "c-hl-phr", x1: px(xa), y1: LAYOUT.HL_PHR_Y, x2: px(xb), y2: LAYOUT.HL_PHR_Y }));
          svg.appendChild(sv("circle", { class: "c-hl-phrknob", cx: px((xa + xb) / 2), cy: LAYOUT.HL_PHR_Y, r: 2.4 }));
        }
        i0 = iEnd + 1;
      }
    }
    if (withKana) {
      var kanaTop = LAYOUT.HL_GRAPH + 2;
      cells.forEach(function (c, i2) {
        if (!c) return;
        var tc = el("span", "c-tc", moras[i2]);
        tc.style.left = px(c[0]) + "px";
        tc.style.width = px(c[1]) + "px";
        tc.style.top = kanaTop + "px";
        tc.setAttribute("data-nc", ns ? stateId + ":" + i2 : "");
        tc.setAttribute("data-src", "mora:" + stateId + ":" + i2);
        if (glow && i2 >= glow.m0 && i2 < glow.m1) { tc.classList.add("c-glow"); tc.setAttribute("data-glow", "1"); }
        wrap.appendChild(tc);
      });
      if (ns) {
        slotIdxs(u).forEach(function (i2) {
          var kb = el("span", "c-kb2");
          kb.style.left = px(padL + ns[i2].x * sx) + "px";
          kb.style.width = px(ns[i2].w * sx) + "px";
          kb.style.top = kanaTop + "px";
          kb.setAttribute("data-nc", stateId + ":" + i2);
          wrap.appendChild(kb);
        });
      }
    }
    return wrap;
  }
  /** 通しの面の高低線（イントネーション切替の層・パーツ=hlLine・カナ行なし＝モーラ行が担う） */
  function hlLineRow(stateId, opts) {
    opts = opts || {};
    var u = state(stateId);
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var row = hlRow(stateId, { kana: false, padL: 0, width: opts.width || vw, vw: vw });
    tag(row, "hlLine");
    return row;
  }
  function hlLabel() {
    var d = el("div", "c-cmplabel");
    d.appendChild(document.createTextNode("読んだときの高低"));
    d.appendChild(el("span", "c-cmplsub", "上=高い／下=低いの2値（辞書）・上端のバー＝アクセント句の区切り"));
    return d;
  }

  /** 「音の枠」欄の機械生成文（機械が書くのはこの欄だけ・出所を明記）。
   *  両埋まりの句も空箱にしない＝音数・読みの高低・印の個数を機械算出（差し戻し4・検証8-9）。 */
  function frameFieldContent(stateId, opts) {
    var u = state(stateId);
    var ns = notesOf(u);
    var lines = [], auto = "";
    var slots = ns ? slotIdxs(u) : [];
    if (ns && u.hyoki && !slots.length) {
      var m = morasOf(u).length;
      var over = m - ns.length;
      lines.push(over > 0 ? m + "音・音符" + ns.length + "個（字余り" + over + "）" : m + "音");
      lines.push("読み: " + M.hlText(effHl(u)) + (u.hand ? "（手で直した）" : "（機械の読み取り）"));
      var mks = marksOf(u, opts);
      var r = mks.filter(function (x) { return x.color === "r"; }).length;
      var y = mks.length - r;
      lines.push("印: " + (mks.length ? [r ? "赤" + r : "", y ? "黄" + y : ""].filter(Boolean).join("・") : "なし"));
      auto = "音数・読み・印は自動で出しています";
    } else if (ns && slots.length) {
      var slotNs = slots.map(function (i) { return ns[i]; });
      var nbars = u.bars ? (u.bars[1] - u.bars[0] + 1) : 1;
      var barW = LAYOUT.TIME_W / nbars;
      var barNo = u.bars ? (u.bars[0] + Math.floor(slotNs[0].x / barW)) : null;
      lines.push(slots.length + "音" + (barNo ? "・" + barNo + "小節目" : ""));
      var ys = slotNs.map(function (n) { return n.y; });
      lines.push("合う読みの高低: " + M.hlText(M.slotSuggestHL(ys)));
      auto = "空きの" + slots.length + "音がメロで" + M.slotTrendText(ys) + "ので、読みの当ては自動で出しています";
    } else if (!ns && u.accent) {
      lines.push(u.accent.moras.length + "音");
      lines.push("読み: " + M.hlText(effHl(u)) + (u.hand ? "（手で直した）" : "（機械の読み取り）"));
      auto = "詞から自動で出しています";
    } else if (u.plan) {
      lines.push(planChipText(u.plan));
      auto = "予定から写しています";
    }
    return { lines: lines, auto: auto };
  }

  /** 意味（人が書く）と音の枠（機械が書く）の二欄。imi が無ければ空欄で出す */
  function fieldPair(stateId) {
    var u = state(stateId);
    var row = el("div", "c-fieldrow");
    var f1 = el("div", "c-field");
    f1.appendChild(el("h4", null, "意味（言いたいこと）"));
    if (u.imi) {
      var fill = el("div", "c-field-fill", u.imi);
      fill.setAttribute("data-src", "imi:" + stateId);
      f1.appendChild(fill);
    } else {
      f1.appendChild(el("div", "c-field-empty", "（まだ書いていない）"));
    }
    f1.appendChild(el("div", "c-field-auto", "自分で書く欄（機械は書かない）"));
    row.appendChild(f1);
    var f2 = el("div", "c-field");
    f2.appendChild(el("h4", null, "音の枠"));
    var fc = frameFieldContent(stateId);
    var fill2 = el("div", "c-field-fill");
    fill2.setAttribute("data-src", "frame:" + stateId);
    fc.lines.forEach(function (t, i) {
      if (i) fill2.appendChild(document.createElement("br"));
      fill2.appendChild(document.createTextNode(t));
    });
    f2.appendChild(fill2);
    if (fc.auto) f2.appendChild(el("div", "c-field-auto", fc.auto));
    row.appendChild(f2);
    return row;
  }

  /** 前後の句の縮小表示（薄い一行・編集画面用） */
  function neighborRow(stateId, prefix) {
    var u = state(stateId);
    var out = document.createDocumentFragment();
    var extra = [];
    if (u.bars) extra.push(barsLabel(u));
    if (!notesOf(u) && u.kind === "phrase" && u.hyoki) extra.push("メロなし");
    if (notesOf(u) && !u.hyoki && !u.noLyric) extra.push("詞の空き");
    out.appendChild(el("div", "c-ghostlbl", prefix + "（" + extra.join("・") + "）"));
    var row = el("div", "c-ku c-ghost c-noline");
    row.setAttribute("data-phrase", stateId);
    row.appendChild(notesOf(u) ? melo(stateId) : meloNone());
    if (u.hyoki) {
      var ly = el("div", "c-ly c-ly-s");
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + stateId);
      ly.appendChild(sp);
      row.appendChild(ly);
    } else if (notesOf(u) && !u.noLyric) {
      row.appendChild(timeRow(stateId, "slots"));
    }
    out.appendChild(row);
    return out;
  }

  /** 対応句の参照行（同じメロの1番側の句・読み取り専用）。 */
  function refRow(stateId) {
    var u = state(stateId);
    if (!u.sameAs) throw new Error(stateId + " に sameAs が無い（対応句参照は同じメロの句だけ）");
    var refU = phrase(u.sameAs);
    var refSec = section(refU.section);
    var out = document.createDocumentFragment();
    out.appendChild(el("div", "c-ghostlbl", "対応する句（同じメロ）: " + refSec.name + " " + barsLabel(refU) + "（読み取り専用）"));
    var row = el("div", "c-ku c-refrow c-noline");
    row.setAttribute("data-phrase", u.sameAs);
    row.appendChild(melo(u.sameAs));
    var ly = el("div", "c-ly c-ly-s");
    if (refU.hyoki) {
      var sp = el("span", null, displayText(refU));
      sp.setAttribute("data-src", "lyric:" + u.sameAs);
      ly.appendChild(sp);
    }
    row.appendChild(ly);
    out.appendChild(row);
    return out;
  }

  /** 操作ボタン列。labels: [{t, main:true}] or 文字列 */
  function ops(labels) {
    var r = el("div", "c-ops");
    labels.forEach(function (x) {
      var t = typeof x === "string" ? x : x.t;
      var s = el("span", "c-op" + (x && x.main ? " c-op-main" : ""), t);
      r.appendChild(s);
    });
    return r;
  }

  /* ---------------- 候補 ---------------- */

  /** 候補カード（詞候補・メロ候補共用）。詞候補は表記＋読みの2層（裁定待ち1の論点は不変）。
   *  メロ候補は作り方（genNote）を正規経路で表示（差し戻し3＝手追記の禁止）。 */
  function candidateCard(candId) {
    var c = cand(candId);
    var tgt = phrase(c.target);
    var card = el("div", "c-cand");
    card.setAttribute("data-cand", candId);
    var badges;
    if (c.hyoki) {
      var w = el("div", "c-cand-w", c.hyoki);
      w.setAttribute("data-src", "cand:" + candId);
      card.appendChild(w);
      var rd = el("div", "c-cand-read", "読み: " + c.accent.moras.join(""));
      rd.setAttribute("data-src", "candread:" + candId);
      card.appendChild(rd);
      var slotYs = slotIdxs(tgt).map(function (i) { return notesOf(tgt)[i].y; });
      badges = M.lyricCandBadges(c, slotYs, currentOpts());
    } else {
      var mini = el("div", "c-cand-mel");
      var vw = LAYOUT.TIME_W;
      var svg = sv("svg", { width: 220, height: 20, viewBox: "0 0 " + vw + " " + LAYOUT.MELO_H });
      c.notes.forEach(function (n) {
        svg.appendChild(sv("rect", { class: "c-nt", x: n.x, y: n.y, width: n.w, height: LAYOUT.MELO_NOTE_H, rx: 1.5 }));
      });
      mini.appendChild(svg);
      card.appendChild(mini);
      var gn = el("div", "c-cand-gen", "作り方: " + c.genNote);
      gn.setAttribute("data-src", "gennote:" + candId);
      card.appendChild(gn);
      badges = M.melodyCandBadges(c.notes, tgt.accent, currentOpts());
    }
    var facts = el("div", "c-cand-facts");
    badges.forEach(function (b) {
      var f = el("span", "c-fact" + (b.tone ? " c-fact-" + b.tone : ""), b.t);
      f.setAttribute("data-src", "badge:" + candId);
      facts.appendChild(f);
    });
    card.appendChild(facts);
    var dest = el("div", "c-cand-dest", destLabel(tgt));
    dest.setAttribute("data-src", "dest:" + candId);
    card.appendChild(dest);
    return card;
  }

  /** 候補シート。mode: "order"（合いそうな順・点数なし） | "group"（事実で区分） */
  function candidateSheet(candIds, mode) {
    var sh = el("div", "c-sheet");
    var h = el("h3", null, "候補");
    h.appendChild(el("span", "c-sheet-mode",
      mode === "group" ? "事実で区分（区分の中の並びに意味は持たせない）" : "合いそうなものから順に（点数は出さない）"));
    sh.appendChild(h);
    if (mode !== "group") {
      candIds.forEach(function (id) { sh.appendChild(candidateCard(id)); });
      return sh;
    }
    var groups = {};
    var order = [];
    candIds.forEach(function (id) {
      var c = cand(id);
      var tgt = phrase(c.target);
      var badges = c.hyoki
        ? M.lyricCandBadges(c, slotIdxs(tgt).map(function (i) { return notesOf(tgt)[i].y; }), currentOpts())
        : M.melodyCandBadges(c.notes, tgt.accent, currentOpts());
      var key;
      if (badges.some(function (b) { return b.tone === "r"; })) key = "読みの高低が逆";
      else if (badges.some(function (b) { return b.tone === "y"; })) key = badges.filter(function (b) { return b.tone === "y"; })[0].t.replace(/ \d+$/, function (m2) { return m2; });
      else key = "音数ぴったり・読みの高低も合う";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(id);
    });
    order.forEach(function (k) {
      sh.appendChild(el("div", "c-cgroup", k));
      groups[k].forEach(function (id) { sh.appendChild(candidateCard(id)); });
    });
    return sh;
  }

  /** 候補依頼フォーム（条件の付け外し）。conds: "word"|"onsu"|"hl"|"imi" の配列。 */
  function requestForm(stateId, conds) {
    var u = state(stateId);
    var box = el("div", "c-reqform");
    box.appendChild(el("h3", null, "候補を頼む"));
    var defs = {
      word: { label: "使いたい語（任意・表記で）", value: "" },
      onsu: { label: "音数（任意）", value: "" },
      hl: { label: "読みの高低（任意）", value: "" },
      imi: { label: "意味（任意）", value: u.imi || "" },
    };
    var ns = notesOf(u);
    if (ns && slotIdxs(u).length) {
      var ys = slotIdxs(u).map(function (i) { return ns[i].y; });
      defs.onsu.value = String(slotIdxs(u).length);
      defs.hl.value = M.hlText(M.slotSuggestHL(ys));
    } else if (!ns && u.accent) {
      defs.onsu.value = String(u.accent.moras.length);
      defs.hl.value = M.hlText(effHl(u));
    }
    (conds || []).forEach(function (k) {
      var d = defs[k];
      if (!d) throw new Error("候補依頼フォームの条件キーが不明: " + k);
      var row = el("div", "c-formrow");
      var lb = el("label", null, d.label);
      row.appendChild(lb);
      var fin = el("span", "c-fin", d.value);
      if (k === "imi" && d.value) fin.setAttribute("data-src", "imi:" + stateId);
      if ((k === "hl" || k === "onsu") && d.value) fin.setAttribute("data-src", "frame:" + stateId);
      row.appendChild(fin);
      row.appendChild(el("span", "c-cond-x", "×"));
      box.appendChild(row);
    });
    if (!conds || !conds.length) box.appendChild(el("div", "c-req-empty", "条件なしで頼む（自由に出してもらう）"));
    var foot = el("div", "c-pop");
    foot.appendChild(el("span", "c-pop-p1", "頼む"));
    foot.appendChild(el("span", null, "条件を足す"));
    foot.appendChild(el("span", null, "やめる"));
    box.appendChild(foot);
    return box;
  }

  /** 予定の記入フォーム（メモ・小節数・音数・読みの高低。すべて任意）。 */
  function planForm(planId) {
    var plan = planId ? D.planById[planId] : null;
    if (planId && !plan) throw new Error("予定がない: " + planId);
    var box = el("div", "c-planform");
    var rows = [
      ["メモ（任意）", plan && plan.memo, false],
      ["小節数（任意）", plan && plan.bars, true],
      ["音数（任意）", plan && plan.onsu, true],
      ["読みの高低（任意）", plan && plan.hl, true],
    ];
    rows.forEach(function (r) {
      var row = el("div", "c-formrow");
      row.appendChild(el("label", null, r[0]));
      var fin = el("span", "c-fin" + (r[2] ? " c-fin-s" : ""), r[1] || "");
      if (r[1] && plan) fin.setAttribute("data-src", "plan:" + plan.id);
      row.appendChild(fin);
      box.appendChild(row);
    });
    var foot = el("div", "c-pop");
    foot.appendChild(el("span", "c-pop-p1", "置く"));
    foot.appendChild(el("span", null, "やめる"));
    box.appendChild(foot);
    return box;
  }

  /** 空きの枠のその場入力（通しの面・枠がそのまま入力欄になる小さな絵）。
   *  ＝割当②の小フォーム。帯・マス表示でも畳んだ（チップ）状態でも同じフォームが開く。 */
  function slotInput(stateId) {
    var u = state(stateId);
    var row = el("div", "c-ku c-noline");
    row.setAttribute("data-phrase", stateId);
    var ly = el("div", "c-ly");
    if (u.hyoki) {
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + stateId);
      ly.appendChild(sp);
    }
    var slots = slotIdxs(u);
    var inp = el("span", "c-inp");
    inp.appendChild(document.createTextNode(slots.length + "音"));
    inp.appendChild(el("i", null, "｜"));
    ly.appendChild(inp);
    var pop = el("span", "c-pop");
    pop.appendChild(el("span", "c-pop-p1", "候補を探す"));
    pop.appendChild(el("span", null, "編集画面で開く"));
    ly.appendChild(pop);
    row.appendChild(ly);
    return row;
  }

  /* ---------------- 案くらべ（枚2「印の決まり」専用） ---------------- */

  /** 案くらべ区画。印の案の上書き（timeRow の marksOpts・onsuDotSample）はこの中でだけ許す。 */
  function compareBox(title, children) {
    var d = el("div", "c-cmpbox");
    d.setAttribute("data-rule-compare", "1");
    d.appendChild(el("h3", null, title));
    (children || []).forEach(function (c) { d.appendChild(c); });
    return d;
  }
  /** 音数ドット案の見本（案くらべ区画専用・既定経路には通さない＝data-mk="onsu-an"）。 */
  function onsuDotSample(stateId) {
    var u = state(stateId);
    var ns = notesOf(u) || [];
    var m = u.hyoki ? morasOf(u).length : 0;
    var d = M.onsuDot(m, ns.length);
    var row = el("div", "c-onsuan");
    row.setAttribute("data-onsu-an", "1");
    row.appendChild(el("span", null, "音数ドット案: "));
    if (d) {
      var fd = el("span", "c-fd c-fd-y");
      fd.setAttribute("data-mk", "onsu-an");
      row.appendChild(fd);
      row.appendChild(el("span", "c-onsuan-why", "（" + d.why + "）"));
    } else {
      row.appendChild(el("span", "c-onsuan-why", "（食い違いなし＝ドットなし）"));
    }
    return row;
  }

  /** 枚13用: セクションの事実の小札（数値は全てデータから機械算出）。
   *  数え方の定義（この関数が正）:
   *   詞の空き   = 空きの枠のある句＋詞があるのに予定（続きの当て）が付いている句
   *   詞なし     = 意図して詞を付けない句（noLyric）
   *   メロ未定   = 帯が句の一部にしか無い句（band指定）＋モーラ数より音符が少ない句
   *   メロの空き = 詞があるのに音符列が無い句
   *   まだ何も無い = zone の数 */
  function sectionFactChips(secId) {
    var s = section(secId);
    var facts = [];
    var lyGap = 0, meloNone2 = 0, meloPart = 0, noLy = 0, zones = 0;
    (s.units || []).forEach(function (u) {
      if (u.kind === "zone") { zones++; return; }
      var ns = notesOf(u);
      if (!u.noLyric && ((ns && slotIdxs(u).length) || (u.hyoki && u.plan))) lyGap++;
      if (ns && (u.band || (u.hyoki && morasOf(u).length > ns.length))) meloPart++;
      if (!ns && u.hyoki) meloNone2++;
      if (u.noLyric) noLy++;
    });
    if (lyGap) facts.push("詞の空き " + lyGap + "か所");
    if (noLy) facts.push("詞なし " + noLy + "範囲");
    if (meloPart) facts.push("メロ未定 " + meloPart + "範囲");
    if (meloNone2) facts.push("メロの空き " + meloNone2 + "句");
    if (zones) facts.push("まだ何も無い " + zones + "区間");
    var wrap = el("div", "c-cfacts");
    facts.forEach(function (t) {
      var f = el("span", "c-fact", t);
      f.setAttribute("data-calc", "secfacts:" + secId);
      wrap.appendChild(f);
    });
    return wrap;
  }

  /** 判定用の説明（枠外・配布スクショでは非表示になる）。設計論はここにだけ書いてよい */
  function desc(text) {
    var d = el("div", "desc");
    d.textContent = text;
    return d;
  }
  /** 枚の中の補助パネル（インセット） */
  function inset(title, children) {
    var d = el("div", "c-inset");
    d.appendChild(el("h3", null, title));
    (children || []).forEach(function (c) { d.appendChild(c); });
    return d;
  }

  g.V8C = {
    LAYOUT: LAYOUT,
    PARTSETS: PARTSETS,
    DISPLAY_ITEMS: DISPLAY_ITEMS,
    SPAN_NOTE: SPAN_NOTE,
    registerSheet: registerSheet,
    renderAll: renderAll,
    sheets: sheets,
    /* データ読み出し */
    state: state, phrase: phrase, section: section, cand: cand,
    notesOf: notesOf, morasOf: morasOf, effHl: effHl, ysOf: ysOf, slotIdxs: slotIdxs,
    displayText: displayText, barsLabel: barsLabel, marksOf: marksOf,
    planChipText: planChipText, rowChipDefs: rowChipDefs, frameFieldContent: frameFieldContent,
    vowelOf: vowelOf,
    /* 通しの面（パーツ宣言制） */
    throughPane: throughPane,
    phone: phone, playbar: playbar, legendText: legendText, legendNote: legendNote,
    melo: melo, meloNone: meloNone, hyokiLine: hyokiLine, planChip: planChip,
    rowChips: rowChips, timeRow: timeRow, prMoraRow: prMoraRow, vowelRow: vowelRow, hlLineRow: hlLineRow,
    phraseRow: phraseRow, sectionHead: sectionHead,
    zoneRow: zoneRow, stockRow: stockRow, stockHead: stockHead, addRow: addRow,
    switchNote: switchNote, dispSheet: dispSheet, helpPanel: helpPanel,
    /* 範囲の編集画面 */
    prFragment: prFragment, prCaption: prCaption, hlRow: hlRow, hlLabel: hlLabel,
    feedRows: feedRows, hlSource: hlSource,
    fieldPair: fieldPair, neighborRow: neighborRow, refRow: refRow, ops: ops,
    candidateCard: candidateCard, candidateSheet: candidateSheet,
    requestForm: requestForm, planForm: planForm, slotInput: slotInput,
    /* 案くらべ・注記ほか */
    compareBox: compareBox, onsuDotSample: onsuDotSample,
    opsTableNote: opsTableNote, sectionFactChips: sectionFactChips,
    desc: desc, inset: inset,
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>

<!-- ============================================================
     工程1: 担当の枚の sheet-<枚id>.js をここに1行足すだけにする。
     枚の中身は V8C.registerSheet() で登録する（書式は components.js 冒頭）。
     このファイルの上の共通CSS・下の描画呼び出しは変更しない。
     ============================================================ -->
<script>
/* ===== sheet-b1.js ===== */
/* sheet-b1.js — 枚1: 歌詞全体画面（作り直し・3態＋ヘルプ姿）。担当B。
 * 態A（既定）／態B（表示シートを開いた姿）／態C（全部オン＝比較材料）／付記=ヘルプを開いた姿。
 * パーツ宣言は計画§3-4の正本（V8C.throughPane が強制）。凡例・割当表は電話枠の外。
 */
V8C.registerSheet({
  id: "b1",
  no: 1,
  title: "歌詞全体画面（既定／表示シート／全部オン＋ヘルプ姿）",
  wide: false,
  marksOpts: { flatPair: "イ", yellowUse: "B" },
  css: [
    ".b1-cap{font-size:12px;color:#c8cdd6;font-weight:600;margin:18px 2px 6px}",
    ".b1-cap-first{margin-top:0}",
  ].join("\n"),
  build(root) {
    const C = V8C;

    function cap(text, first) {
      const d = document.createElement("div");
      d.className = "b1-cap" + (first ? " b1-cap-first" : "");
      d.textContent = text;
      return d;
    }

    /* 曲Aの通し（全セクション・データの並び順のまま）。態A/態Cで同じ中身を出す＝長さの比較を成立させる */
    function fillSongA(pane, opts) {
      opts = opts || {};
      pane.appendChild(C.sectionHead("A-intro"));
      pane.appendChild(C.sectionHead("A-1A"));
      pane.appendChild(C.phraseRow("A-1A-k1", opts.now ? { now: true } : {}));
      pane.appendChild(C.phraseRow("A-1A-k2"));
      pane.appendChild(C.phraseRow("A-1A-k3"));
      pane.appendChild(C.phraseRow("A-1A-k4"));
      pane.appendChild(C.sectionHead("A-1B"));
      pane.appendChild(C.phraseRow("A-1B-k1"));
      pane.appendChild(C.phraseRow("A-1B-k2"));
      pane.appendChild(C.zoneRow("A-1B-z1"));
      pane.appendChild(C.sectionHead("A-1S"));
      pane.appendChild(C.phraseRow("A-1S-k1"));
      pane.appendChild(C.phraseRow("A-1S-k2"));
      pane.appendChild(C.phraseRow("A-1S-k3"));
      pane.appendChild(C.phraseRow("A-1S-k4"));
      pane.appendChild(C.sectionHead("A-2A"));
      pane.appendChild(C.phraseRow("A-2A-k1"));
      pane.appendChild(C.phraseRow("A-2A-k2"));
      pane.appendChild(C.phraseRow("A-2A-k3"));
      pane.appendChild(C.phraseRow("A-2A-k4"));
      pane.appendChild(C.sectionHead("A-2B"));
      pane.appendChild(C.phraseRow("A-2B-k1"));
      pane.appendChild(C.phraseRow("A-2B-k2"));
      pane.appendChild(C.zoneRow("A-2B-z1"));
      pane.appendChild(C.sectionHead("A-2S"));
      pane.appendChild(C.phraseRow("A-2S-k1"));
      pane.appendChild(C.phraseRow("A-2S-k2"));
      pane.appendChild(C.phraseRow("A-2S-k3"));
      pane.appendChild(C.sectionHead("A-C"));
      pane.appendChild(C.phraseRow("A-C-k1"));
      pane.appendChild(C.phraseRow("A-C-k2"));
      pane.appendChild(C.phraseRow("A-C-k3"));
      pane.appendChild(C.sectionHead("A-D"));
      pane.appendChild(C.phraseRow("A-D-k1"));
      pane.appendChild(C.phraseRow("A-D-k2"));
      pane.appendChild(C.phraseRow("A-D-k3"));
      pane.appendChild(C.phraseRow("A-D-k4"));
      pane.appendChild(C.phraseRow("A-D-k5"));
      pane.appendChild(C.phraseRow("A-D-k6"));
      pane.appendChild(C.sectionHead("A-kan2"));
      pane.appendChild(C.sectionHead("A-oosabi"));
      pane.appendChild(C.zoneRow("A-oosabi-z1"));
      pane.appendChild(C.sectionHead("A-outro"));
      pane.appendChild(C.zoneRow("A-outro-z1"));
      pane.appendChild(C.addRow(["＋ セクションを足す", "＋ 予定を置く", "＋ 断片を置く"]));
      pane.appendChild(C.stockHead());
      pane.appendChild(C.stockRow("A-st1"));
    }

    /* ---- 態A（既定）: 表記の行＋穴の事実チップ＋行末ドット。帯・空マスは畳む ---- */
    root.appendChild(cap("既定の表示（何も触っていないとき）", true));
    root.appendChild(C.phone(
      { title: "サンプル曲（サンプルEP）", tab: "素", headBtn: "表示" },
      [C.throughPane("A", (pane) => { fillSongA(pane, { now: true }); })]
    ));
    root.appendChild(C.legendNote("plain"));
    root.appendChild(C.opsTableNote());

    /* ---- 態B: 「表示」を開いた姿（6項目＋既定に戻す） ---- */
    root.appendChild(cap("「表示」を開いたところ（出すものを選ぶ）"));
    root.appendChild(C.phone(
      { title: "サンプル曲（サンプルEP）", tab: "素", headBtn: "表示", playbar: false },
      [
        C.throughPane("B", (pane) => {
          pane.appendChild(C.sectionHead("A-1A"));
          pane.appendChild(C.phraseRow("A-1A-k1"));
          pane.appendChild(C.phraseRow("A-1A-k2"));
          pane.appendChild(C.dispSheet());
        }),
      ]
    ));

    /* ---- 態C: 全部オン（メロ帯＋空きマスの列）＝今までのうるささの比較材料 ---- */
    root.appendChild(cap("全部オンにしたところ（メロ帯＋空きマスの列・比較用）"));
    root.appendChild(C.phone(
      { title: "サンプル曲（サンプルEP）", tab: "素", headBtn: "表示" },
      [C.throughPane("C", (pane) => { fillSongA(pane); })]
    ));

    /* ---- 付記: ヘルプを開いた姿（凡例・割当表はこの中にだけ枠内に出る） ---- */
    root.appendChild(cap("ヘルプを開いたところ（凡例と操作の割当はここに畳む）"));
    root.appendChild(C.phone(
      { title: "サンプル曲（サンプルEP）", tab: "素", headBtn: "表示", playbar: false },
      [
        C.throughPane("A_HELP", (pane) => {
          pane.appendChild(C.sectionHead("A-1A"));
          pane.appendChild(C.phraseRow("A-1A-k1"));
          pane.appendChild(C.helpPanel());
        }),
      ]
    ));

    root.appendChild(C.desc(
      "枚1＝通しの面の作り直し（3態＋ヘルプ姿・裁定待ち§10-1の材料）。" +
      "態A: 表記の行で読める・空マス列は「詞の空きN音」チップに畳む・「メロの空き」チップを既定で出す（裁定2）・" +
      "凡例と割当①〜⑤は電話枠の外の注記へ（v7で常設だった説明11行の撤去）。" +

      "母音の段は音符の時間データに揃えて置く。韻の下線は句のおわり2音（e-u）の3句＝A-1A-k1・A-1A-k3・A-1B-k1。" +

<script>

<script>
/* ===== sheet-c9.js ===== */
/* sheet-c9.js — 範囲の編集画面（かな書きの句と読み取りの誤り）。新設。

 *  案1 = 読み取り用の表記「庭へ　みずをまく」を添えて読みが直る before/after
 *  案2 = 読みの高低をタップで反転する手上書きの1状態（出所が「手で直した」に変わる）
 * 光りは読み取り用の表記の欄にだけ出る（表記の欄は光らない＝その旨の一言は feedRows が出す）。 */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;

  C.registerSheet({
    id: "c9",

      ".c9-arrow{text-align:center;color:#565d69;font-size:12px;margin:4px 0}",

      var crumb = song.title.replace(/（.*$/, "") + " › " + sec.name + " › " + pos + "つ目の句";

        ]

      root.appendChild(C.desc(
        "枚9（新設・§1-6＝裁定待ち§10-2の両案）。実測: 「にわへ」=高高低（誤・に|わへ に割れる）／" +

(function (g) {

<script>

/* sheet-m13.js — 枚13: 既存画面への足し込み（担当D・ほぼ引き継ぎ）。
 * 左=曲画面（既存）: 右上に「歌詞」ボタン・各セクションカードに欠けの小札。
 *   小札は V8C.sectionFactChips（データからの機械算出・data-calc付き）。
 *   置かれたメロのブロックのチップは V8C.rowChips（同じく機械算出）。手書きの数値は無い。
 * 右=PianoRoll（既存）: 右上に「歌詞で見る」ボタン。印は V8C.prFragment 経由で
 *   marks.js の規則から導出（手置きなし）。音符に付く文字は割り付いたモーラ。
 * 歌詞の2層の反映: カードのブロックに出る歌詞は表記（漢字仮名交じり・displayText）。 */
V8C.registerSheet({
  id: "m13",
  no: 13,
  title: "既存画面への足し込み",
  wide: true,
  marksOpts: { flatPair: "イ", yellowUse: "B" },
  css: [
    ".m13-cols{display:flex;gap:24px;align-items:flex-start}",
    ".m13-panel{flex:0 0 auto}",
    ".m13-pcap{font-size:11px;color:#9aa0aa;margin:0 0 6px 2px;max-width:352px}",
    ".m13-card{display:flex;align-items:flex-start;gap:7px;background:#22252b;border:1px solid #33373f;border-left:3px solid #4a5160;border-radius:9px;padding:7px 9px;margin:0 0 6px}",
    ".m13-card-kari{border-style:dashed;border-left-style:dashed;background:#1c1f25}",
    ".m13-cmain{min-width:0}",
    ".m13-cname{font-weight:600;font-size:13px;white-space:nowrap}",
    ".m13-cbars{color:#9aa0aa;font-size:11px;margin-top:1px}",
    ".m13-block{display:flex;align-items:center;gap:6px;border:1px solid #2e4a5e;background:#182028;border-radius:9px;padding:6px 9px;margin:-2px 0 6px 14px;font-size:12px}",
    ".m13-bkind{font-size:10px;color:#7fc0e8;border:1px solid #2e4a5e;border-radius:6px;padding:0 5px;flex:none}",
    ".m13-bchips{margin-left:auto;margin-top:0}",
    ".m13-prosody{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11px;color:#e6e8ec;margin:2px 2px 8px}",

    ".m13-r{color:#e8533f}",
    ".m13-y{color:#e0a83c}",
    ".m13-note{font-size:10px;color:#6d7480;margin-top:6px;line-height:1.6}",
  ].join("\n"),
  build(root) {
    const C = V8C, D = V8DATA;
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    /* ---- 左: 曲画面（セクションカード＋置かれたメロのブロック） ---- */
    function sectionCard(s) {
      const card = el("div", "m13-card" + (s.kari ? " m13-card-kari" : ""));
      const main = el("div", "m13-cmain");
      const nm = el("div", "m13-cname", s.name);
      if (s.kari) {
        nm.appendChild(document.createTextNode(" "));
        nm.appendChild(el("span", "c-karichip", "仮"));
      }
      main.appendChild(nm);
      let barsTxt = s.bars
        ? (s.bars[1] - s.bars[0] + 1) + "小節・" + s.bars[0] + "–" + s.bars[1]
        : (s.barsText || "");
      if (s.noSing) barsTxt += "（歌なし）";
      main.appendChild(el("div", "m13-cbars", barsTxt));
      card.appendChild(main);
      card.appendChild(C.sectionFactChips(s.id)); // 小札=データからの機械算出（data-calc付き）
      return card;
    }
    /* 置かれたメロのブロック（曲画面に既存の表示）。歌詞は表記・チップは機械算出 */
    function meloBlock(id) {

      const row = el("div", "m13-block");
      row.setAttribute("data-phrase", id);
      row.appendChild(el("span", "m13-bkind", "メロ"));
      const t = el("span", null);
      t.appendChild(document.createTextNode("「"));
      const w = el("span", null, C.displayText(u));
      w.setAttribute("data-src", "lyric:" + id);
      t.appendChild(w);
      t.appendChild(document.createTextNode("」"));
      row.appendChild(t);
      const chips = C.rowChips(id);
      if (chips) {
        chips.classList.add("m13-bchips");
        row.appendChild(chips);
      }
      return row;
    }

    const leftKids = [];

      leftKids.push(sectionCard(s));
      if (s.id === "A-1A") leftKids.push(meloBlock("A-1A-k2"));

    leftKids.push(C.addRow(["＋ セクションを足す"]));

    const leftPanel = el("div", "m13-panel");
    leftPanel.appendChild(el("div", "m13-pcap",

    const prId = "A-1B-k1";
    const u = C.phrase(prId);

    prosody.appendChild(el("i", "m13-r", "赤=アクセント逆行"));
    prosody.appendChild(el("i", "m13-y", "黄=注意"));
    prosody.appendChild(el("i", null, "印なし=指摘なし"));

    const rightPanel = el("div", "m13-panel");
    rightPanel.appendChild(el("div", "m13-pcap",
      "PianoRoll（既存）に足すもの＝右上の「歌詞で見る」ボタン。赤黄の印と詞モードは既存の機能のまま"));
    rightPanel.appendChild(C.phone(
      { title: prTitle, headBtn: "歌詞で見る" },
      [
        prosody,
        C.prFragment(prId),
        el("div", "m13-note",
          "印はどの画面でも同じ規則から出ます＝同じ句なら歌詞の画面と同じ音符に同じ印が付く"),
        el("div", "m13-note",
          "音符に付く文字は音符に割り付いたモーラ（読み）。書かれたままの歌詞（表記）は歌詞の画面が持つ"),
      ]
    ));

    const cols = el("div", "m13-cols");
    cols.appendChild(leftPanel);
    cols.appendChild(rightPanel);
    root.appendChild(cols);

    root.appendChild(C.desc(
      "枚13（v7の枚11）=既存画面への足し込み（ほぼ引き継ぎ）。小札の数値は sectionFactChips・ブロックのチップは " +
      "rowChips のデータ算出＝手書き数値ゼロ（v7の数え漏れの再発防止）。PianoRollの印は prFragment 経由で " +
      "marks.js の規則から導出（手置きなし）。歌詞の2層の反映＝カードの歌詞が表記（漢字仮名交じり）になり、" +
      "音符側の文字はモーラのまま（注記1行で区別を明示）。案はイ+B。"
    ));
  },
});

<script>

    function row(items) {
      const r = el("div", "m14-row");
      items.forEach(function (x) { r.appendChild(x); });
      return r;
    }

    const w = el("div", "m14-wrap");

    /* ---- 入口 ---- */
    w.appendChild(el("div", "m14-lab", "入口"));
    w.appendChild(row([
      box("ホーム「歌詞」タイル → 曲を選ぶ"),
      box("曲画面「歌詞」ボタン"),
      box("プロジェクトタブ"),
      box("PianoRoll「歌詞で見る」"),
    ]));
    w.appendChild(row([
      box("メロネタ単体「歌詞で見る」"),
      arr(),
      box("確認: どの曲に入れるか選ぶ／新しく作る", null, "m14-box-dash"),
    ]));
    w.appendChild(el("div", "m14-down", "↓ どの入口からも1手"));

    /* ---- 2つの場と、範囲の開き方 ---- */
    w.appendChild(row([
      box("歌詞全体画面（通しの面）",
        "既定の表示＝表記の歌詞＋穴の事実チップ＋印ドット（メロ帯・空きマスは畳む）。" +
        "表示切替: 素・音韻・イントネーション。詞テキストはこの面でその場入力（下の割当①②）",
        "m14-box-main m14-box-w216"),
      arr("⇄"),
      arrlab("開く単位＝語・句・複数句・パート・セクション・区間の任意範囲。" +
        "音符矩形をタップ＝1手（割当③・帯を畳んでいるときは行・見出しの長押しから）・" +
        "長押しで範囲を選ぶ（割当④）。戻ると同じスクロール位置・同じ表示切替・同じパーツ選択（割当⑤）"),
      arr("⇄"),
      box("範囲の編集画面",
        "最上位に自分の言葉を書き入れる欄。候補を探す→入れる／戻す。同じ範囲を開き直しても同じ画面。" +
        "パーツ選択の対象外＝常に全部出す",
        "m14-box-main m14-box-w216"),
    ]));
    w.appendChild(el("div", "m14-note",
      "仮セクションは「確定にする」の明示操作ではじめて曲画面に実体化。暗黙には作らない"));

    /* ---- 通しの面の中の重ね（画面は変わらない＝遷移の矢印は増えない） ---- */
    w.appendChild(el("div", "m14-lab", "通しの面の中の重ね（画面は変わらない＝遷移の矢印は増えない）"));
    w.appendChild(row([
      box("「表示」シート（パーツ選択）",
        "ヘッダの「表示」から開く重ね。出すものを選ぶ: " +
        C.DISPLAY_ITEMS.map(function (it) { return it.label; }).join("・") +
        "＋「既定に戻す」。効くのは通しの面だけ（範囲の編集画面は常に全部出す）。選択は表示切替をまたいで記憶",
        "m14-box-over m14-box-w216"),
      box("ヘルプ",
        "凡例と操作の割当①〜⑤はここに畳まれている＝画面に常設しない。開いた姿も通しの面の重ね",
        "m14-box-over m14-box-w216"),
    ]));

    /* ---- 範囲の編集画面の中の変化（画面は変わらない＝遷移の矢印は増えない） ---- */
    w.appendChild(el("div", "m14-lab", "範囲の編集画面の中の変化（画面は変わらない＝遷移の矢印は増えない）"));
    w.appendChild(row([
      box("表記を直した直後",
        "同じ画面のまま、読み（モーラ・高低）・印・音数のチップが再計算されて変わる。戻すも同じ画面",
        "m14-box-over m14-box-w216"),
      box("かな書きの句の読み取り直し",
        "読み取り用の表記を添える／読みの高低を手で直す。読みの出所（機械／手）の表示が変わるだけで画面は移らない",
        "m14-box-over m14-box-w216"),
    ]));

    /* ---- 断片を並びに入れる（白紙の曲でも同じ道） ---- */
    w.appendChild(el("div", "m14-lab", "断片を並びに入れる（セクションが1つも無い白紙の曲でも同じ道）"));
    w.appendChild(row([
      box("「並びに入れる」",
        "通しの面の「まだ並びに入れていないもの」の断片から", "m14-box-w216"),
      arr(),
      box("確認: 置き場所を選ぶ／新しくセクションを作る", null, "m14-box-dash m14-box-w216"),
      arr(),
      box("通しの面（置いた場所へ戻る）"),
    ]));
    w.appendChild(el("div", "m14-note",
      "白紙の曲では「新しくセクションを作る」だけが出る。確認を通らずにセクションが作られることはない"));

    /* ---- 文字を打てる場所（入力の橋） ---- */
    w.appendChild(el("div", "m14-lab", "文字を打てる場所"));
    w.appendChild(row([
      box("通しの面",
        "詞テキストをタップ＝その場にカーソル（割当①）。空きの枠（帯・マス表示のとき）／" +
        "「詞の空きN音」チップ（畳んでいるとき）をタップ＝小フォームで打つ（割当②）"),
      box("範囲の編集画面",
        "書き入れる欄（候補より上）。候補を入れたあとも同じ欄で書き換え・戻すができる。" +
        "読み取り用の表記もこの画面の欄に書く"),
    ]));

    /* ---- 編集画面からの橋 ---- */
    w.appendChild(el("div", "m14-lab", "範囲の編集画面からの橋（行って戻れる）"));
    w.appendChild(row([
      box("範囲の編集画面", null, "m14-box-main"),
      arr(),
      box("PianoRoll（メロを開く・断片タップ）"),
      box("配置画面（配置を開く）"),
      box("歌詞ネタ（引用⇄曲へ渡す）"),
      box("チャット（相談）"),
      box("トレイ"),
    ]));

    /* ---- 通しの面の操作の割当（正準文字列・枚1の枠外と文字列一致で照合される） ---- */
    w.appendChild(el("div", "m14-lab", "通しの面の操作の割当"));
    w.appendChild(C.opsTableNote());

    root.appendChild(w);

    root.appendChild(C.desc(
      "枚14（v7の枚12）=ページ遷移図（引き直し）。v7からの差分＝(1)「表示」シート（パーツ選択）とヘルプを" +
      "「通しの面の中の重ね」の行として追加（遷移の矢印は増やさない）(2)凡例・割当表の常設をやめヘルプに畳んだ旨を明記" +
      "(3)新枚2枚（表記を直した直後・かな書きの読み取り直し）は範囲の編集画面の中の変化の行＝矢印は増やしていない" +
      "(4)割当③⑤の文面変化（帯を畳んでいるときの開き方・パーツ選択の保存）を矢印の札に反映" +
      "(5)割当表は opsTableNote（データの正準文字列・検証が文字列一致を照合）。表示シートの6項目は DISPLAY_ITEMS から機械生成。"
    ));
  },
});

</script>
