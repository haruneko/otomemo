<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作詞補助UI モック v7（判定材料・詞は全部ダミー）</title>
<style>
/* ============================================================
   v7 共通CSS（工程0）。共通クラスは全て c- 接頭辞。
   枚（sheet-*.js）が足してよいのは自分の枚id接頭辞のクラスだけ
   （registerSheet が機械検査する）。共通部品の見た目を変えたい
   ときはここを直さず工程0担当へ依頼すること。
   例外的に接頭辞なしで残す3クラス:
     .frame / .desc / .st … レンダ工程（render.mjs）が参照する枠・
     枠外説明・判定札。この3つは配布スクショで非表示・除去される。
   ============================================================ */
:root{
  --bg:#16181c; --card:#22252b; --line:#33373f; --fg:#e6e8ec; --muted:#9aa0aa;
  --accent:#3a6df0; --mel:#7fc0e8; --fit-red:#e8533f; --fit-yellow:#e0a83c; --hl:#a58ee0;
}
*{box-sizing:border-box}
body{margin:0;padding:28px 24px 60px;background:#0e1013;color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.55}
h1{font-size:20px;margin:0 0 4px}
.c-sub{color:var(--muted);font-size:12px;margin:0 0 26px;max-width:760px}
.frames{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start}
.frame{flex:0 0 auto;width:352px}
.frame.wide{width:760px}
.desc{color:var(--muted);font-size:12px;margin:10px 2px 0;line-height:1.6}
.st{font-size:9px;color:#a99ad0;border:1px dashed #6b5f8a;border-radius:4px;padding:0 4px;white-space:nowrap}
.c-fcap{font-size:15px;margin:0 0 8px;color:var(--fg)}
.c-fcap-no{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;
  font-size:12px;padding:1px 7px;margin-right:8px;vertical-align:2px}

/* ===== 電話枠 ===== */
.c-ph{width:352px;background:var(--bg);border:1px solid #3c414a;border-radius:20px;
  padding:12px 11px 10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.c-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.c-back{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:13px;white-space:nowrap}
.c-ttl{flex:1;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-hbtn{background:var(--card);border:1px solid var(--accent);color:#9db8f7;border-radius:10px;
  padding:5px 10px;font-size:12px;white-space:nowrap}
.c-crumb{flex:1;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:5px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-seg{display:flex;gap:4px;background:#1b1e24;border:1px solid var(--line);border-radius:10px;
  padding:3px;margin-bottom:8px}
.c-seg span{flex:1;text-align:center;font-size:12px;color:var(--muted);padding:4px 0;border-radius:7px}
.c-seg .c-seg-on{background:var(--accent);color:#fff}
.c-legend{font-size:10.5px;color:var(--muted);margin:0 2px 8px}

/* ===== セクション見出し ===== */
.c-sec{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:12px 0 4px}
.c-sec-kari{border-style:dashed;border-color:#59606c;background:#1c1f25}
.c-grip{color:#5b616c;font-size:12px;letter-spacing:-2px}
.c-sname{font-weight:600;font-size:13px;white-space:nowrap}
.c-sbars{color:var(--muted);font-size:11px}
.c-karichip{font-size:10px;color:#c9b27a;border:1px dashed #8a7a4d;border-radius:6px;padding:0 5px}
.c-samechip{font-size:10px;color:#8fb8a8;border:1px solid #3d5a4f;border-radius:6px;padding:0 6px}
.c-secbtn{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);
  border-radius:7px;padding:1px 7px;white-space:nowrap}
.c-partsep{border-top:1px dashed #454b56;margin:9px 2px 0;height:1px}

/* ===== 句の行 ===== */
.c-ku{position:relative;padding:6px 2px 7px;border-bottom:1px solid #1f2228}
.c-noline{border-bottom:none}
.c-ku-now{outline:1px solid var(--accent);border-radius:8px;background:rgba(58,109,240,.07)}
.c-nowmark{position:absolute;left:-2px;top:4px;color:var(--accent);font-size:10px}
.c-krow{display:flex;gap:6px}
.c-kmain{flex:1;min-width:0}
.c-kside{width:58px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  padding-top:3px;font-size:10px;color:#6d7480}
.c-melo{margin-bottom:3px}
.c-melo svg{display:block}
.c-melo-none{height:12px}
.c-band{fill:rgba(79,168,224,.13);stroke:rgba(79,168,224,.30);stroke-width:.6}
.c-nt{fill:var(--mel)}
.c-ly{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13.5px;min-height:20px}
.c-ly-s{font-size:12px}
.c-imi{font-size:10.5px;color:#7d8697;margin-top:2px}
.c-dslot{display:inline-flex;align-items:center;border:1px dashed #565d69;border-radius:6px;
  padding:2px 8px;color:var(--muted);font-size:11px;margin-left:4px}
.c-fd{display:inline-block;width:7px;height:7px;border-radius:50%}
.c-fd-r{background:var(--fit-red)}
.c-fd-y{background:var(--fit-yellow)}

/* 下段（時間揃えの枠・棒・文字）＝音符矩形と同じ座標式から置く */
.c-fr{position:relative;height:20px;margin-top:1px}
.c-fr .c-kb2{position:absolute;top:0;height:17px;border:1px solid #4d535d;background:#1a1d22;border-radius:3px}
.c-fr .c-bar2{position:absolute;top:8px;height:2px;background:#7a828e;border-radius:1px}
.c-tc{position:absolute;top:2px;text-align:center;font-size:12.5px;white-space:nowrap}
.c-frlab{position:absolute;left:50%;transform:translateX(-50%);top:2px;font-size:10px;color:var(--muted);
  background:rgba(22,24,28,.88);padding:0 6px;border-radius:4px}
.c-fr-after{position:absolute;top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap}

/* 印（規則関数からだけ出る。下線=文字側の印） */
.c-mk-r{box-shadow:inset 0 -2px 0 var(--fit-red)}
.c-mk-y{box-shadow:inset 0 -2px 0 var(--fit-yellow)}

/* 点線の区間 */
.c-zone{display:flex;align-items:center;gap:8px;border:1px dashed #565d69;border-radius:9px;
  padding:12px 10px;margin:6px 0;color:var(--muted);font-size:11.5px}
.c-zone-pos{margin-left:auto;color:#6d7480;font-size:10px}

/* 追加操作・断片置き場 */
.c-addrow{display:flex;gap:8px;margin:14px 0 4px}
.c-addbtn{flex:1;text-align:center;border:1px dashed #565d69;border-radius:10px;
  padding:9px 4px;color:var(--muted);font-size:12.5px}
.c-stockhd{color:var(--muted);font-size:11px;margin:16px 2px 2px;border-top:1px solid var(--line);padding-top:10px}
.c-stockku{background:#1a1d22;border:1px solid var(--line);border-radius:9px;padding:7px 8px;border-bottom:1px solid var(--line)}
.c-placebtn{font-size:10.5px;color:#9db8f7;border:1px solid var(--accent);border-radius:7px;padding:1px 7px;margin-left:6px}
.c-stockpos{margin-left:auto;color:#6d7480;font-size:10px}

/* 再生バー */
.c-playbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
.c-pb{min-width:42px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg);padding:0 6px}
.c-pb-play{background:var(--accent);border-color:var(--accent);min-width:50px}
.c-pb-sp{margin-left:auto;border:none;background:none;color:var(--muted);min-width:auto}

/* ===== 範囲の編集画面 ===== */
.c-ghost{opacity:.45}
.c-ghostlbl{font-size:10px;color:var(--muted);margin:8px 2px 0}
.c-refrow{background:#181d1b;border:1px solid #2c3a34;border-radius:9px;padding:6px 8px}
.c-target{border:1px solid var(--accent);border-radius:10px;padding:8px 8px 9px;margin:4px 0;background:#181c25}
.c-fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.c-field{border:1px solid var(--line);border-radius:10px;background:#1b1e24;padding:7px 8px;min-height:86px}
.c-field h4{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:600}
.c-field-fill{font-size:12.5px;color:var(--fg)}
.c-field-empty{font-size:11px;color:#565d69}
.c-field-auto{font-size:10px;color:#6d7480;margin-top:5px}
.c-ops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.c-op{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:5px 9px;font-size:11.5px;color:var(--fg)}
.c-op-main{border-color:var(--accent);color:#9db8f7}

/* 実PianoRoll断片（読み取り専用） */
.c-pr{position:relative;clear:both;border:1px solid var(--line);border-radius:9px;height:104px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#191c21 0 13px,#1d2026 13px 26px)}
.c-pr-bl{position:absolute;top:0;bottom:0;width:1px;background:#2b303a}
.c-pr-n{position:absolute;height:12px;background:var(--mel);border-radius:3px;font-size:9px;
  color:#123;text-align:center;line-height:12px;overflow:hidden}
.c-pr-i{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--fit-yellow);
  color:#222;font-size:8px;line-height:11px;text-align:center;font-style:normal}
.c-pr-i-r{background:var(--fit-red);color:#fff}
.c-pr-empty{height:34px;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:#565d69;font-size:11px}
.c-prcap{font-size:9.5px;color:#6d7480;margin-top:3px}

/* 高低線（読んだときの高低・2値）＋カナ行 */
.c-cmp{position:relative;margin-top:7px}
.c-cmp svg{position:absolute;left:0;top:0}
.c-cmp .c-tc{height:19px;line-height:19px;font-size:13px}
.c-cmp .c-kb2{position:absolute;height:17px;border:1px dashed #565d69;background:#1a1d22;border-radius:3px}
.c-hl-guide{stroke:#3f454e;stroke-width:1;stroke-dasharray:2 3}
.c-hl-line{stroke:var(--hl);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.c-hl-dot{fill:var(--hl)}
.c-hl-phr{stroke:#7a828e;stroke-width:1.5;stroke-linecap:round}
.c-hl-phrknob{fill:#7a828e}
.c-cmplabel{font-size:10px;color:var(--fg);font-weight:600;margin:8px 2px 1px}
.c-cmplsub{font-weight:400;color:var(--muted);margin-left:6px;font-size:9.5px}

/* 候補シート・候補カード */
.c-sheet{border:1px solid var(--line);border-top:2px solid #4a5160;border-radius:14px 14px 12px 12px;
  background:#1d2026;margin-top:12px;padding:9px 9px 8px}
.c-sheet h3{margin:0 0 7px;font-size:12px;color:var(--fg)}
.c-sheet-mode{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}
.c-cand{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:6px 8px;margin-bottom:6px}
.c-cand-w{font-size:14px}
.c-cand-mel{margin:2px 0}
.c-cand-facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.c-fact{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:0 5px}
.c-fact-y{color:var(--fit-yellow);border-color:#6b5a34}
.c-fact-r{color:var(--fit-red);border-color:#6b4034}
.c-cand-dest{font-size:9.5px;color:#6d7480;margin-top:3px}
.c-cgroup{font-size:11px;color:var(--muted);margin:9px 0 5px;border-bottom:1px solid var(--line);padding-bottom:2px}

/* フォーム類 */
.c-reqform,.c-planform{border:1px solid var(--line);border-radius:10px;background:#1b1e24;padding:8px 9px;margin-top:10px}
.c-reqform h3{margin:0 0 6px;font-size:12px;color:var(--fg)}
.c-formrow{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:12px}
.c-formrow label{color:var(--muted);font-size:11px;width:110px;flex:none}
.c-fin{border:1px solid var(--line);background:#15181d;border-radius:6px;padding:2px 7px;
  color:var(--fg);font-size:11.5px;flex:1;min-height:20px}
.c-fin-s{flex:0 0 72px}
.c-fin:empty{color:#565d69}
.c-cond-x{color:#6d7480;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.c-req-empty{font-size:11px;color:var(--muted);border:1px dashed #565d69;border-radius:8px;padding:7px 8px;margin:6px 0}
.c-pop{display:inline-flex;gap:5px;margin-top:6px}
.c-pop span{font-size:10.5px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 7px;color:var(--fg)}
.c-pop-p1{border-color:var(--accent) !important;color:#9db8f7 !important}
.c-inp{display:inline-block;min-width:62px;border:1px solid var(--accent);background:#1b2333;
  border-radius:5px;padding:1px 6px;font-size:12.5px;color:#8a93a6;vertical-align:-2px}
.c-inp i{font-style:normal;color:var(--fg)}

/* 操作割当の注記（データの文字列をそのまま出す） */
.c-opstable{white-space:pre-line;font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;margin:8px 0;line-height:1.7}

/* 枚7用のカード */
.c-cfacts{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}

/* インセット */
.c-inset{background:var(--bg);border:1px solid #3c414a;border-radius:14px;padding:10px 11px;margin-top:14px}
.c-inset h3{margin:0 0 7px;font-size:12px;color:var(--fg)}
</style>
</head>

読みの高低は高い/低いの2値（pyopenjtalk 実測の焼き込み）。幅350px級の電話枠・既存アプリの暗色調。</p>

<script>
/* ===== marks.js ===== */
/* v7 marks.js — 印の規則（唯一の定義）。
 *
 * 全ての枚はこのファイルの関数から印を導く。印の手置きは禁止
 * （components.js が印を出すときに data-mk="rule" を付ける。検証がこれを照合する）。
 *
 * 規則:
 * - 赤   = 同一アクセント句内の隣接モーラ対で、読みの高低の変化（高→低／低→高）と
 *          メロの上下が逆。
 * - 平らな対（高→高・低→低）でメロが大きく動く（|Δ相対音高| >= FLAT_MOVE_MIN）:
 *          案「ア」= 印なし ／ 案「イ」= 黄。opts.flatPair で切替。
 * - 黄の使い途: 案「A」=「読みが変化する箇所でメロが平ら」も黄 ／
 *          案「B」= 黄は音数系（字余り・足りない）に限定＝高低由来の黄は出さない。
 *          opts.yellowUse で切替。※案「イ」の黄は flatPair 側の切替に属する
 *          （「イ」を選べば yellowUse に関わらず出る。組合せの意味はコードが正）。
 *
 * 音高の向き: データの y は「上が小さい」（相対音高・v6踏襲）。
 *            メロが上がる = y が減る。
 * 読みの高低: accent.py（pyopenjtalk）の出力を焼いたもの以外を渡さないこと。
 */
(function (g) {
  "use strict";

  // 「平らな対で大きく動く」の閾値（相対音高yの差・データ単位）。1か所に閉じる。
  var FLAT_MOVE_MIN = 3;

  var DEFAULT_OPTS = { flatPair: "ア", yellowUse: "B" };

  /**
   * 印の導出。
   * @param hl   0/1 の配列（0=低, 1=高）… accent.py の焼き込み値
   * @param ap   アクセント句id の配列（同値=同一アクセント句）… accent.py の焼き込み値
   * @param ys   モーラに対応する音符の相対音高 y の配列（音符が無いモーラは null）
   * @param opts {flatPair:"ア"|"イ", yellowUse:"A"|"B"}
   * @returns [{i, color:"r"|"y", why}] … i はモーラ番号（対の後ろ側に付ける）
   */
  function computeMarks(hl, ap, ys, opts) {
    opts = opts || DEFAULT_OPTS;
    var flatPair = opts.flatPair || "ア";
    var yellowUse = opts.yellowUse || "B";
    var out = [];
    var n = Math.min(hl.length, ap.length, ys.length);
    for (var i = 0; i + 1 < n; i++) {
      if (ap[i] !== ap[i + 1]) continue;                 // アクセント句をまたぐ対は見ない
      if (ys[i] == null || ys[i + 1] == null) continue;  // 音符が無い対は見ない
      var r = hl[i + 1] - hl[i];       // 読み: +1=上がる / -1=下がる / 0=平ら
      var m = ys[i] - ys[i + 1];       // メロ: +=上がる / -=下がる / 0=平ら
      if ((r > 0 && m < 0) || (r < 0 && m > 0)) {
        out.push({ i: i + 1, color: "r",
          why: "逆行（読みは" + (r > 0 ? "上がる" : "下がる") + "・メロは" + (m > 0 ? "上がる" : "下がる") + "）" });
      } else if (r === 0 && Math.abs(m) >= FLAT_MOVE_MIN && flatPair === "イ") {
        out.push({ i: i + 1, color: "y", why: "平らな対でメロが大きく動く" });
      } else if (r !== 0 && m === 0 && yellowUse === "A") {
        out.push({ i: i + 1, color: "y", why: "読みが変わるがメロは平ら" });
      }
    }
    return out;
  }

  /** HL列 → 「高低低」表記。バッジの高低表記はこれだけを使う。 */
  function hlText(hl) {
    var s = "";
    for (var i = 0; i < hl.length; i++) s += hl[i] ? "高" : "低";
    return s;
  }

  /** 空き音符列に「合う読みの高低」を機械提案（音の枠欄用）。中央より高い音=高。 */
  function slotSuggestHL(ys) {
    if (!ys.length) return [];
    var mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
    var mid = (mn + mx) / 2;
    return ys.map(function (y) { return y < mid ? 1 : 0; }); // yが小さい=高い
  }

  /** 空き音符列の動きの説明文（音の枠欄の自動注記用）。 */
  function slotTrendText(ys) {
    if (ys.length < 2) return "動きは小さい";
    var d = ys[ys.length - 1] - ys[0];
    if (d >= FLAT_MOVE_MIN) return "下がっていく";
    if (d <= -FLAT_MOVE_MIN) return "上がっていく";
    return "大きくは動かない";
  }

  /**
   * 詞候補のバッジ（全て機械生成。手書き文字列の混入禁止）。
   * @param cand   {word, accent:{moras,hl,ap}}
   * @param slotYs 宛先の空き音符の y 列
   * @returns [{t:表示文字列, tone:""|"y"|"r", marks?}]
   */
  function lyricCandBadges(cand, slotYs, opts) {
    var m = cand.accent.moras.length, s = slotYs.length;
    var badges = [];
    if (m === s) badges.push({ t: "音数ぴったり", tone: "" });
    else if (m > s) badges.push({ t: "字余り " + (m - s), tone: "y" });
    else badges.push({ t: "足りない " + (s - m), tone: "y" });
    var k = Math.min(m, s);
    var marks = computeMarks(cand.accent.hl.slice(0, k), cand.accent.ap.slice(0, k), slotYs.slice(0, k), opts);
    var reds = marks.filter(function (x) { return x.color === "r"; });
    var hs = hlText(cand.accent.hl);
    if (reds.length) badges.push({ t: "逆行 " + reds.length + "（" + hs + "）", tone: "r", marks: marks });
    else if (m === s) badges.push({ t: "読みの高低が合う（" + hs + "）", tone: "", marks: marks });
    else badges.push({ t: "読みの高低は合う（" + hs + "）", tone: "", marks: marks });
    return badges;
  }

  /**
   * メロ候補のバッジ（全て機械生成）。
   * @param candNotes 候補の音符列 [{x,w,y}]
   * @param accent    宛先の句の焼き込みアクセント {moras,hl,ap}
   */
  function melodyCandBadges(candNotes, accent, opts) {
    var m = accent.moras.length, s = candNotes.length;
    var badges = [];
    if (s === m) badges.push({ t: "音数ぴったり", tone: "" });
    else if (s < m) badges.push({ t: "音が足りない " + (m - s), tone: "y" });
    else badges.push({ t: "音が多い " + (s - m), tone: "y" });
    var k = Math.min(m, s);
    var ys = candNotes.slice(0, k).map(function (n) { return n.y; });
    var marks = computeMarks(accent.hl.slice(0, k), accent.ap.slice(0, k), ys, opts);
    var reds = marks.filter(function (x) { return x.color === "r"; });
    if (reds.length) badges.push({ t: "逆行 " + reds.length, tone: "r", marks: marks });
    else badges.push({ t: "読みの高低に沿う", tone: "", marks: marks });
    return badges;
  }

  g.V7MARKS = {
    FLAT_MOVE_MIN: FLAT_MOVE_MIN,
    DEFAULT_OPTS: DEFAULT_OPTS,
    OPTS: { flatPair: ["ア", "イ"], yellowUse: ["A", "B"] },
    computeMarks: computeMarks,
    hlText: hlText,
    slotSuggestHL: slotSuggestHL,
    slotTrendText: slotTrendText,
    lyricCandBadges: lyricCandBadges,
    melodyCandBadges: melodyCandBadges
  };
  if (typeof module !== "undefined" && module.exports) module.exports = g.V7MARKS;
})(typeof window !== "undefined" ? window : globalThis);

</script>

/* v7 components.js — 共通部品（唯一の実装）。工程1はインスタンス化のみ可・再実装禁止。
 *
 * 前提: data.js（V7DATA）と marks.js（V7MARKS）を先に読み込むこと。
 *
 * 使い方（枚の登録）:
 *   V7C.registerSheet({
 *     id: "b1",              // 枚id ＝ CSSクラス接頭辞（この枚のCSSクラスは全て "b1-" で始めること）
 *     no: 1,                 // 表示順
 *     title: "歌詞全体画面・素の表示",
 *     wide: false,           // 幅広の枚（枚7・枚8相当）だけ true。電話枠の枚は false（352px検査対象）
 *     demo: false,           // true = 部品の自己点検用（配布スクショから除外）
 *     marksOpts: { flatPair: "ア", yellowUse: "B" },   // この枚が使う印の案の宣言（検証が突き合わせる）
 *     css: "...",            // この枚専用のCSS（クラス接頭辞を機械検査する）
 *     build(root) { ... }    // root に部品を組み立てる。部品は V7C.* だけを使う
 *   });
 *
 * 座標の規則（過去の振幅潰し事故の再発防止）:
 *   すべての座標は LAYOUT の定数からだけ計算する。SVGパスの手書き禁止。
 *   高低線の y は LAYOUT.HL_HI / LAYOUT.HL_LO の2値ちょうど（検証が実測する）。
 *   モーラ区画の x位置・幅は対応する音符矩形と同じ式から出す（縦揃え・検証が1px以内を実測）。
 *
 * 印の規則: 印を出すのは markCell()/markNote() 経由のみ（data-mk="rule" が付く）。
 *   印の色・位置は V7MARKS.computeMarks() の出力だけから決まる。手置き禁止。
 */
(function (g) {
  "use strict";
  var D = g.V7DATA, M = g.V7MARKS;
  if (!D || !M) throw new Error("data.js と marks.js を先に読み込むこと");

  /* ================= 描画定数（1か所に閉じる） ================= */
  var LAYOUT = {
    TIME_W: 256,        // 句の時間グリッド（データの x/w の単位・小さいメロ表示の既定幅）
    MELO_H: 24,         // 縮小ピアノロールの viewBox 高さ
    MELO_NOTE_H: 5,     // 縮小ピアノロールの音符矩形の高さ
    PR_INNER_W: 292,    // 実PianoRoll断片の内側の幅(px)
    PR_PAD_L: 1,        // 断片の枠線ぶんの左オフセット(px)
    PR_H: 104,          // 断片の高さ(px)
    PR_PAD_T: 6, PR_PAD_B: 6,
    PR_NOTE_H: 12,      // 断片の音符の高さ(px)
    PITCH_RANGE: 24,    // 相対音高 y の値域（0=一番上）
    HL_GRAPH: 40,       // 高低線のグラフ高さ(px)
    HL_HI: 12, HL_LO: 32,  // 高い/低いの y（段差20px。この2値以外に点を置かない）
    HL_PHR_Y: 3,        // アクセント句バーの y
    HL_DOT: 2.6,        // 高低線の点の半径
    HL_KANA_H: 20,      // 高低線の下のカナ行の高さ(px)
    FR_H: 20,           // 時間揃え文字の行の高さ(px)
  };
  var SVGNS = "http://www.w3.org/2000/svg";

  /* ================= 小さな道具 ================= */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function px(v) { return Math.round(v * 10) / 10; }

  /* ================= データ読み出し（全て id 経由） ================= */
  function phrase(id) {
    var u = D.phraseById[id];
    if (!u) throw new Error("句がない: " + id);
    return u;
  }
  function section(id) {
    var s = D.sectionById[id];
    if (!s) throw new Error("セクションがない: " + id);
    return s;
  }
  function cand(id) {
    var c = D.candById[id];
    if (!c) throw new Error("候補がない: " + id);
    return c;
  }
  /* 音符列の解決（{ref:} は借用元へ。座標データを二重に書かない） */
  function notesOf(u) {
    if (!u.notes) return null;
    if (Array.isArray(u.notes)) return u.notes;
    if (u.notes.ref) return notesOf(phrase(u.notes.ref));
    return null;
  }
  function morasOf(u) { return u.accent ? u.accent.moras : []; }
  /* モーラ i ↔ 音符 i（恒等対応）。音符が無いモーラは null */
  function ysOf(u) {
    var ns = notesOf(u) || [];
    return morasOf(u).map(function (_, i) { return i < ns.length ? ns[i].y : null; });
  }
  /* 空きの枠＝歌詞モーラより後ろの音符（noLyric の句は空きではない） */
  function slotIdxs(u) {
    var ns = notesOf(u) || [];
    if (u.noLyric) return [];
    var m = morasOf(u).length;
    var out = [];
    for (var i = m; i < ns.length; i++) out.push(i);
    return out;
  }
  function displayText(u) { return (u.words || []).join("　"); }
  function barsLabel(u) {
    if (!u.bars) return "";
    return u.bars[0] === u.bars[1] ? u.bars[0] + "小節" : u.bars[0] + "–" + u.bars[1] + "小節";
  }
  /* 印（唯一の導出経路）。opts 省略時は今組み立て中の枚の宣言を使う */
  function marksOf(u, opts) {
    if (!u.accent) return [];
    return M.computeMarks(u.accent.hl, u.accent.ap, ysOf(u), opts || currentOpts());
  }
  /* 宛先ラベル（候補カード用） */
  function destLabel(u) {
    var sec = section(u.section);
    var sg = D.songs[u.song];
    return "宛先: " + sg.title.replace(/（.*$/, "") + " › " + sec.name + " › " + barsLabel(u).replace("小節", "小節の句");
  }

  /* ================= 印の付与（この2つ以外から印を出さない） ================= */
  function markCell(cell, mk) {
    cell.classList.add(mk.color === "r" ? "c-mk-r" : "c-mk-y");
    cell.setAttribute("data-mk", "rule");
    cell.setAttribute("data-mk-why", mk.why);
  }
  function markNote(noteEl, container, mk, leftPx, topPx) {
    noteEl.classList.add(mk.color === "r" ? "c-mk-r" : "c-mk-y");
    noteEl.setAttribute("data-mk", "rule");
    noteEl.setAttribute("data-mk-why", mk.why);
    var dot = el("i", "c-pr-i" + (mk.color === "r" ? " c-pr-i-r" : ""), "i");
    dot.setAttribute("data-mk", "rule");
    dot.style.left = px(leftPx) + "px";
    dot.style.top = px(Math.max(0, topPx - 13)) + "px";
    container.appendChild(dot);
  }

  /* ================= 枚の登録と描画 ================= */
  var sheets = [];
  var _current = null;
  function currentOpts() {
    return (_current && _current.marksOpts) || M.DEFAULT_OPTS;
  }
  var CLASS_RE = /\.(-?[_a-zA-Z][-_a-zA-Z0-9]*)/g;
  function registerSheet(sh) {
    if (!sh || !sh.id || !/^[a-z][a-z0-9]*$/.test(sh.id)) throw new Error("枚idは英小文字+数字: " + (sh && sh.id));
    if (sheets.some(function (s) { return s.id === sh.id; })) throw new Error("枚id重複: " + sh.id);
    if (typeof sh.build !== "function") throw new Error("build が無い: " + sh.id);
    if (!sh.marksOpts || M.OPTS.flatPair.indexOf(sh.marksOpts.flatPair) < 0 ||
        M.OPTS.yellowUse.indexOf(sh.marksOpts.yellowUse) < 0) {
      throw new Error("枚 " + sh.id + ": marksOpts（flatPair:ア|イ, yellowUse:A|B）の宣言が必要");
    }
    if (sh.css) {
      var m2, bad = [];
      CLASS_RE.lastIndex = 0;
      while ((m2 = CLASS_RE.exec(sh.css))) {
        if (m2[1].indexOf(sh.id + "-") !== 0) bad.push("." + m2[1]);
      }
      if (bad.length) throw new Error("枚 " + sh.id + " のCSSに接頭辞違反のクラス: " + bad.join(" ") +
        "（この枚のクラスは全て " + sh.id + "- で始める。共通部品の見た目を変えたいときは工程0へ依頼）");
    }
    sheets.push(sh);
  }
  function renderAll(container) {
    sheets.sort(function (a, b) { return (a.no || 99) - (b.no || 99); });
    sheets.forEach(function (sh) {
      var fr = el("div", "frame" + (sh.wide ? " wide" : ""));
      fr.setAttribute("data-sheet", sh.id);
      if (sh.demo) fr.setAttribute("data-demo", "1");
      fr.setAttribute("data-marks-opts", JSON.stringify(sh.marksOpts));
      var h = el("h2", "c-fcap");
      var no = el("span", "c-fcap-no", String(sh.no != null ? sh.no : "?"));
      h.appendChild(no);
      h.appendChild(document.createTextNode(sh.title || sh.id));
      fr.appendChild(h);
      if (sh.css) {
        var st = document.createElement("style");
        st.textContent = sh.css;
        fr.appendChild(st);
      }
      var body = el("div");
      fr.appendChild(body);
      _current = sh;
      try { sh.build(body); } finally { _current = null; }
      container.appendChild(fr);
    });
  }

  /* ================= 部品 ================= */
  var alignSeq = 0;

  /** 電話枠。opts: {title, crumb(パンくず文字列), tab:"素"|"音韻"|"イントネーション"|null,
   *  legend: 文字列|null, playbar:true} 子要素は children 配列。 */
  function phone(opts, children) {
    var ph2 = el("div", "c-ph");
    var hd = el("div", "c-hd");
    hd.appendChild(el("span", "c-back", "← 戻る"));
    if (opts.crumb) {
      var cr = el("span", "c-crumb");
      cr.innerHTML = "";
      cr.textContent = opts.crumb;
      hd.appendChild(cr);
    } else {
      hd.appendChild(el("span", "c-ttl", opts.title || ""));
    }
    if (opts.headBtn) hd.appendChild(el("span", "c-hbtn", opts.headBtn));
    ph2.appendChild(hd);
    if (opts.tab !== undefined && opts.tab !== null) {
      var seg = el("div", "c-seg");
      ["素", "音韻", "イントネーション"].forEach(function (t) {
        seg.appendChild(el("span", t === opts.tab ? "c-seg-on" : "", t));
      });
      ph2.appendChild(seg);
    }
    if (opts.legend) ph2.appendChild(el("div", "c-legend", opts.legend));
    (children || []).forEach(function (c) { ph2.appendChild(c); });
    if (opts.playbar !== false) ph2.appendChild(playbar());
    return ph2;
  }

  /** 再生バー */
  function playbar() {
    var pb = el("div", "c-playbar");
    pb.appendChild(el("span", "c-pb", "|◀"));
    pb.appendChild(el("span", "c-pb c-pb-play", "▶"));
    pb.appendChild(el("span", "c-pb", "⟳"));
    pb.appendChild(el("span", "c-pb c-pb-sp", "1:1"));
    pb.appendChild(el("span", "c-pb", "◀)))"));
    return pb;
  }

  /** 凡例（既定文）。kind: "plain"（通しの面・素）| "into"（イントネーション）| 文字列そのまま */
  function legendText(kind) {
    if (kind === "plain") return "上段=メロの縮小表示（矩形の横幅=音の長さ・縦=相対の音高。タップで編集画面）。行の右端の●=印のある箇所あり（赤=アクセント逆行・黄=注意）。印なし=指摘なし";
    if (kind === "into") return "赤=アクセント逆行・黄=注意・印なし=指摘なし（印は文字への下線。既存の韻律チェックと同じ作法）";
    return kind;
  }

  /** 縮小ピアノロール（メロの矩形）。unitId の音符列（ref解決込み）を描く。
   *  opts: {width(px・既定=TIME_W), vw(データ幅・既定=TIME_W か stock の w), ghost} */
  function melo(unitId, opts) {
    opts = opts || {};
    var u = phrase(unitId);
    var ns = notesOf(u);
    if (!ns) return meloNone();
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var w = opts.width || vw;
    var h = Math.round(LAYOUT.MELO_H * (w / vw));
    var wrap = el("div", "c-melo" + (opts.ghost ? " c-ghost" : ""));
    wrap.style.height = h + "px";
    var svg = sv("svg", { width: w, height: h, viewBox: "0 0 " + vw + " " + LAYOUT.MELO_H });
    var bands = u.band || [[0, vw]];
    bands.forEach(function (b) {
      svg.appendChild(sv("rect", { class: "c-band", x: b[0], y: 3, width: b[1], height: 18, rx: 4 }));
    });
    ns.forEach(function (n, i) {
      var r = sv("rect", { class: "c-nt", x: n.x, y: n.y, width: n.w, height: LAYOUT.MELO_NOTE_H, rx: 1.5 });
      r.setAttribute("data-nr", unitId + ":" + i);
      svg.appendChild(r);
    });
    wrap.appendChild(svg);
    return wrap;
  }
  /** メロ未定のときの薄い余白（帯なし） */
  function meloNone() { return el("div", "c-melo c-melo-none"); }

  /** 素の表示の歌詞行（通しの面）。plan があれば予定チップ、noLyric なら横棒。 */
  function lyricLine(unitId) {
    var u = phrase(unitId);
    var ly = el("div", "c-ly");
    if (u.words) {
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + unitId);
      ly.appendChild(sp);
    }
    if (u.plan) ly.appendChild(planChip(u.plan));
    return ly;
  }

  /** 予定チップ（点線の小箱）。表示文字列は予定の欄（メモ・音数・小節数・読みの高低）から機械結合 */
  function planChipText(plan) {
    var parts = [];
    if (plan.memo) parts.push(plan.memo);
    if (plan.onsu) parts.push(plan.onsu);
    if (plan.bars) parts.push(plan.bars + "小節");
    if (plan.hl) parts.push("読み " + plan.hl);
    return parts.join("・");
  }
  function planChip(plan) {
    var c = el("span", "c-dslot", planChipText(plan));
    c.setAttribute("data-src", "plan:" + plan.id);
    return c;
  }

  /** 時間揃えの下段（.c-fr）。mode:
   *   "slots"  … 空きの枠だけ（詞が無い音符の位置に枠。全空きにも語尾空きにも使う）
   *   "bar"    … 詞なしの横棒（noLyric）
   *   "kana"   … 文字を音符の時間位置に置く（イントネーション表示）。印は規則から。
   *  幅は melo と同じ w/vw 比で置く（縦揃え）。 */
  function timeRow(unitId, mode, opts) {
    opts = opts || {};
    var u = phrase(unitId);
    var ns = notesOf(u) || [];
    var vw = opts.vw || u.w || LAYOUT.TIME_W;
    var w = opts.width || vw;
    var f = w / vw;
    var fr = el("div", "c-fr");
    fr.setAttribute("data-phrase", unitId);
    if (mode === "bar") {
      ns.forEach(function (n, i) {
        var b = el("span", "c-bar2");
        b.style.left = px(n.x * f) + "px";
        b.style.width = px(n.w * f) + "px";
        b.setAttribute("data-nc", unitId + ":" + i);
        fr.appendChild(b);
      });
      var lab = el("span", "c-frlab", "詞なし");
      fr.appendChild(lab);
      return fr;
    }
    var moras = morasOf(u);
    var mks = {};
    if (mode === "kana") marksOf(u, opts.marksOpts).forEach(function (mk) { mks[mk.i] = mk; });
    /* 案を部品単位で上書きした場合は宣言を要素に残す（検証2が枚の宣言の代わりに照合する。
       印の規則表のように1枚の中で複数の案を並べる枚のための正規の道） */
    if (opts.marksOpts) fr.setAttribute("data-marks-opts", JSON.stringify(opts.marksOpts));
    ns.forEach(function (n, i) {
      if (i < moras.length && mode === "kana") {
        var tc = el("span", "c-tc", moras[i]);
        tc.style.left = px(n.x * f) + "px";
        tc.style.width = px(n.w * f) + "px";
        tc.setAttribute("data-nc", unitId + ":" + i);
        tc.setAttribute("data-src", "mora:" + unitId + ":" + i);
        if (mks[i]) markCell(tc, mks[i]);
        fr.appendChild(tc);
      } else if (i >= moras.length && !u.noLyric) {
        var kb = el("span", "c-kb2");
        kb.style.left = px(n.x * f) + "px";
        kb.style.width = px(n.w * f) + "px";
        kb.setAttribute("data-nc", unitId + ":" + i);
        fr.appendChild(kb);
      }
    });
    /* 音符よりモーラが多い（メロ未定の続き）は文字のまま後ろに置く */
    if (mode === "kana" && moras.length > ns.length && ns.length) {
      var lastN = ns[ns.length - 1];
      var after = el("span", "c-fr-after", moras.slice(ns.length).join(""));
      after.setAttribute("data-src", "lyricafter:" + unitId);
      after.style.left = px((lastN.x + lastN.w) * f + 10) + "px";
      fr.appendChild(after);
    }
    return fr;
  }

  /** 通しの面の句の一行（メロ小表示＋下段＋右の小節ラベル・印の要約ドット）。
   *  view: "plain" | "into"。opts: {now:true(再生中の強調)} */
  function phraseRow(unitId, view, opts) {
    opts = opts || {};
    var u = phrase(unitId);
    var ns = notesOf(u);
    var row = el("div", "c-ku" + (opts.now ? " c-ku-now" : ""));
    row.setAttribute("data-phrase", unitId);
    var scope = "s" + (++alignSeq);
    row.setAttribute("data-align-scope", scope);
    if (opts.now) row.appendChild(el("span", "c-nowmark", "▶"));
    var krow = el("div", "c-krow");
    var main = el("div", "c-kmain");
    main.appendChild(ns ? melo(unitId) : meloNone());
    if (view === "into" && u.words && ns) {
      main.appendChild(timeRow(unitId, "kana"));
    } else if (u.noLyric) {
      main.appendChild(timeRow(unitId, "bar"));
    } else if (u.words) {
      main.appendChild(lyricLine(unitId));
      if (ns && slotIdxs(u).length) main.appendChild(timeRow(unitId, "slots"));
    } else if (ns) {
      if (u.plan) main.appendChild(lyricLine(unitId));
      main.appendChild(timeRow(unitId, "slots"));
    } else {
      main.appendChild(lyricLine(unitId)); // 予定チップだけの行（詞もメロも無い句）
    }
    krow.appendChild(main);
    var side = el("div", "c-kside");
    var mks = marksOf(u);
    if (mks.some(function (m) { return m.color === "r"; })) {
      var fd = el("span", "c-fd c-fd-r"); fd.setAttribute("data-mk", "rule"); side.appendChild(fd);
    } else if (mks.length) {
      var fd2 = el("span", "c-fd c-fd-y"); fd2.setAttribute("data-mk", "rule"); side.appendChild(fd2);
    }
    if (u.bars) side.appendChild(el("span", null, barsLabel(u)));
    krow.appendChild(side);
    row.appendChild(krow);
    if (u.imi) {
      var im = el("div", "c-imi", u.imi);
      im.setAttribute("data-src", "imi:" + unitId);
      row.appendChild(im);
    }
    return row;
  }

  /** セクション見出し。opts: {} … データから 仮・小節数・同じメロ表示を機械で出す */
  function sectionHead(secId) {
    var s = section(secId);
    var head = el("div", "c-sec" + (s.kari ? " c-sec-kari" : ""));
    head.setAttribute("data-section", secId);
    head.appendChild(el("span", "c-grip", "⋮⋮"));
    head.appendChild(el("span", "c-sname", s.name));
    if (s.kari) head.appendChild(el("span", "c-karichip", "仮"));
    var lenTxt = s.barsText || (s.bars ? (s.bars[1] - s.bars[0] + 1) + "小節" : "");
    if (s.noSing) lenTxt += "（歌なし）";
    head.appendChild(el("span", "c-sbars", lenTxt));
    if (s.sameMelodyAs) {
      var ref = section(s.sameMelodyAs);
      var chip = el("span", "c-samechip", "同じメロ: " + ref.name);
      chip.setAttribute("data-src", "same:" + secId);
      head.appendChild(chip);
    }
    if (s.kari) head.appendChild(el("span", "c-secbtn", "確定にする"));
    return head;
  }

  /** まだ何も無い区間（点線）。予定があれば予定チップを併記。 */
  function zoneRow(zoneId) {
    var z = phrase(zoneId);
    var zn = el("div", "c-zone");
    zn.setAttribute("data-phrase", zoneId);
    zn.appendChild(el("span", null, "まだ何も無い区間"));
    if (z.plan) zn.appendChild(planChip(z.plan));
    if (z.bars) zn.appendChild(el("span", "c-zone-pos", barsLabel(z)));
    return zn;
  }

  /** まだ並びに入れていないもの（断片）の一行 */
  function stockRow(stockId) {
    var st = phrase(stockId);
    var row = el("div", "c-ku c-stockku");
    row.setAttribute("data-phrase", stockId);
    row.appendChild(melo(stockId, { vw: st.w }));
    var ly = el("div", "c-ly");
    var sp = el("span", null, displayText(st));
    sp.setAttribute("data-src", "lyric:" + stockId);
    ly.appendChild(sp);
    ly.appendChild(el("span", "c-placebtn", "並びに入れる"));
    ly.appendChild(el("span", "c-stockpos", "場所: " + (st.place || "未定")));
    row.appendChild(ly);
    return row;
  }
  function stockHead() { return el("div", "c-stockhd", "まだ並びに入れていないもの"); }

  /** 追加操作の行（＋セクションを足す 等）。labels: 文字列配列 */
  function addRow(labels) {
    var r = el("div", "c-addrow");
    labels.forEach(function (t) { r.appendChild(el("span", "c-addbtn", t)); });
    return r;

  /* ---------------- 範囲の編集画面まわり ---------------- */

  /** 実PianoRoll断片（読み取り専用）。音符・カナ・印を LAYOUT の式から描く。
   *  メロが無い句は「まだメロがありません」の空表示。 */
  function prFragment(unitId, opts) {
    opts = opts || {};
    var u = phrase(unitId);
    var ns = notesOf(u);
    if (!ns) {
      var e = el("div", "c-pr-empty", "まだメロがありません");
      e.setAttribute("data-phrase", unitId);
      return e;
    }
    var moras = morasOf(u);
    var box = el("div", "c-pr");
    box.setAttribute("data-phrase", unitId);
    if (opts.marksOpts) box.setAttribute("data-marks-opts", JSON.stringify(opts.marksOpts));
    var sx = LAYOUT.PR_INNER_W / LAYOUT.TIME_W;
    var ystep = (LAYOUT.PR_H - LAYOUT.PR_PAD_T - LAYOUT.PR_PAD_B - LAYOUT.PR_NOTE_H) / LAYOUT.PITCH_RANGE;
    /* 小節の区切り線（句の小節数で等分） */
    var nbars = u.bars ? (u.bars[1] - u.bars[0] + 1) : 2;
    for (var b = 1; b < nbars; b++) {
      var bl = el("div", "c-pr-bl");
      bl.style.left = px(LAYOUT.PR_PAD_L + (LAYOUT.PR_INNER_W * b) / nbars) + "px";
      box.appendChild(bl);
    }
    var mks = {};
    marksOf(u, opts.marksOpts).forEach(function (mk) { mks[mk.i] = mk; });
    ns.forEach(function (n, i) {
      var left = LAYOUT.PR_PAD_L + n.x * sx;
      var top = LAYOUT.PR_PAD_T + n.y * ystep;
      var ne = el("div", "c-pr-n", i < moras.length ? moras[i] : "");
      if (i < moras.length) ne.setAttribute("data-src", "mora:" + unitId + ":" + i);
      ne.setAttribute("data-nr", unitId + ":" + i);
      ne.style.left = px(left) + "px";
      ne.style.top = px(top) + "px";
      ne.style.width = px(n.w * sx) + "px";
      box.appendChild(ne);
      if (mks[i]) markNote(ne, box, mks[i], left + n.w * sx / 2 - 5, top);
    });
    return box;
  }
  function prCaption() {
    return el("div", "c-prcap", "実メロの断片（読み取り専用・赤/黄の印は音符側）。タップするとピアノロールが開きます");
  }

  /** 高低線（読んだときの高低・2値）＋カナ行。
   *  メロがある句: 区画のx位置・幅は真上の実PianoRoll断片の音符矩形と同じ式（縦揃え）。
   *  メロが無い句: 文字の並びに沿って等間隔。
   *  詞が無い音符の位置は空きの枠だけ（読みが未知であることを埋めない）。 */
  function hlRow(unitId, opts) {
    opts = opts || {};
    var u = phrase(unitId);
    var ns = notesOf(u);
    var moras = morasOf(u);
    var acc = u.accent;
    var W = LAYOUT.PR_INNER_W;
    var wrap = el("div", "c-cmp");
    wrap.setAttribute("data-phrase", unitId);
    wrap.style.height = (LAYOUT.HL_GRAPH + 2 + LAYOUT.HL_KANA_H) + "px";
    var svg = sv("svg", { width: W + LAYOUT.PR_PAD_L, height: LAYOUT.HL_GRAPH,
      viewBox: "0 0 " + (W + LAYOUT.PR_PAD_L) + " " + LAYOUT.HL_GRAPH });
    svg.setAttribute("data-hl", unitId);
    wrap.appendChild(svg);
    var sx = W / LAYOUT.TIME_W;
    /* 各モーラの区画 [left,width] を音符（あれば）か等間隔（なければ）から決める */
    var cells = [];
    for (var i = 0; i < moras.length; i++) {
      if (ns && i < ns.length) {
        cells.push([LAYOUT.PR_PAD_L + ns[i].x * sx, ns[i].w * sx]);
      } else if (!ns) {
        var cw = Math.floor(W / Math.max(1, moras.length));
        cells.push([LAYOUT.PR_PAD_L + i * cw, cw - 2]);
      } else {
        cells.push(null); // メロ未定の続きのモーラは高低線に出さない（時間の基準が無い）
      }
    }
    if (acc) {
      /* モーラごとの破線の縦ガイド */
      cells.forEach(function (c) {
        if (!c) return;
        var cx = c[0] + c[1] / 2;
        svg.appendChild(sv("line", { class: "c-hl-guide", x1: cx, y1: LAYOUT.HL_PHR_Y + 5, x2: cx, y2: LAYOUT.HL_GRAPH - 2 }));
      });
      /* アクセント句ごとに折れ線・点・上端のバー */
      var i0 = 0;
      while (i0 < moras.length) {
        var apv = acc.ap[i0];
        var iEnd = i0;
        while (iEnd + 1 < moras.length && acc.ap[iEnd + 1] === apv) iEnd++;
        var pts = [];
        for (var j = i0; j <= iEnd; j++) {
          if (!cells[j]) continue;
          var cx2 = cells[j][0] + cells[j][1] / 2;
          var cy = acc.hl[j] ? LAYOUT.HL_HI : LAYOUT.HL_LO;
          pts.push([cx2, cy]);
        }
        if (pts.length) {
          svg.appendChild(sv("polyline", { class: "c-hl-line",
            points: pts.map(function (p) { return px(p[0]) + "," + p[1]; }).join(" ") }));
          pts.forEach(function (p) {
            svg.appendChild(sv("circle", { class: "c-hl-dot", cx: px(p[0]), cy: p[1], r: LAYOUT.HL_DOT }));
          });
          var xa = cells[i0] ? cells[i0][0] + 2 : pts[0][0];
          var cEnd = cells[iEnd] || cells[i0];
          var xb = cEnd ? cEnd[0] + cEnd[1] - 2 : pts[pts.length - 1][0];
          svg.appendChild(sv("line", { class: "c-hl-phr", x1: px(xa), y1: LAYOUT.HL_PHR_Y, x2: px(xb), y2: LAYOUT.HL_PHR_Y }));
          svg.appendChild(sv("circle", { class: "c-hl-phrknob", cx: px((xa + xb) / 2), cy: LAYOUT.HL_PHR_Y, r: 2.4 }));
        }
        i0 = iEnd + 1;
      }
    }
    /* カナ行（高低線の下）＋空きの枠 */
    var kanaTop = LAYOUT.HL_GRAPH + 2;
    cells.forEach(function (c, i) {
      if (!c) return;
      var tc = el("span", "c-tc", moras[i]);
      tc.style.left = px(c[0]) + "px";
      tc.style.width = px(c[1]) + "px";
      tc.style.top = kanaTop + "px";
      tc.setAttribute("data-nc", ns ? unitId + ":" + i : "");
      tc.setAttribute("data-src", "mora:" + unitId + ":" + i);
      wrap.appendChild(tc);
    });
    if (ns) {
      slotIdxs(u).forEach(function (i) {
        var kb = el("span", "c-kb2");
        kb.style.left = px(LAYOUT.PR_PAD_L + ns[i].x * sx) + "px";
        kb.style.width = px(ns[i].w * sx) + "px";
        kb.style.top = kanaTop + "px";
        kb.setAttribute("data-nc", unitId + ":" + i);
        wrap.appendChild(kb);
      });
    }
    return wrap;
  }
  function hlLabel() {
    var d = el("div", "c-cmplabel");
    d.appendChild(document.createTextNode("読んだときの高低"));
    d.appendChild(el("span", "c-cmplsub", "上=高い／下=低いの2値（辞書）・上端のバー＝アクセント句の区切り"));
    return d;
  }

  /** 「音の枠」欄の機械生成文（機械が書くのはこの欄だけ・出所を明記） */
  function frameFieldContent(unitId) {
    var u = phrase(unitId);
    var ns = notesOf(u);
    var lines = [], auto = "";
    var slots = ns ? slotIdxs(u) : [];
    if (ns && slots.length) {
      var slotNs = slots.map(function (i) { return ns[i]; });
      var nbars = u.bars ? (u.bars[1] - u.bars[0] + 1) : 1;
      var barW = LAYOUT.TIME_W / nbars;
      var barNo = u.bars ? (u.bars[0] + Math.floor(slotNs[0].x / barW)) : null;
      lines.push(slots.length + "音" + (barNo ? "・" + barNo + "小節目" : ""));
      var ys = slotNs.map(function (n) { return n.y; });
      lines.push("合う読みの高低: " + M.hlText(M.slotSuggestHL(ys)));
      auto = "空きの" + slots.length + "音がメロで" + M.slotTrendText(ys) + "ので、読みの当ては自動で出しています";
    } else if (!ns && u.accent) {
      lines.push(u.accent.moras.length + "音");
      lines.push("アクセント: " + M.hlText(u.accent.hl));
      auto = "詞から自動で出しています";
    } else if (u.plan) {
      lines.push(planChipText(u.plan));
      auto = "予定から写しています";
    }
    return { lines: lines, auto: auto };
  }

  /** 意味（人が書く）と音の枠（機械が書く）の二欄。imi が無ければ空欄で出す */
  function fieldPair(unitId) {
    var u = phrase(unitId);
    var row = el("div", "c-fieldrow");
    var f1 = el("div", "c-field");
    f1.appendChild(el("h4", null, "意味（言いたいこと）"));
    if (u.imi) {
      var fill = el("div", "c-field-fill", u.imi);
      fill.setAttribute("data-src", "imi:" + unitId);
      f1.appendChild(fill);
    } else {
      f1.appendChild(el("div", "c-field-empty", "（まだ書いていない）"));
    }
    f1.appendChild(el("div", "c-field-auto", "自分で書く欄（機械は書かない）"));
    row.appendChild(f1);
    var f2 = el("div", "c-field");
    f2.appendChild(el("h4", null, "音の枠"));
    var fc = frameFieldContent(unitId);
    var fill2 = el("div", "c-field-fill");
    fill2.setAttribute("data-src", "frame:" + unitId);
    fc.lines.forEach(function (t, i) {
      if (i) fill2.appendChild(document.createElement("br"));
      fill2.appendChild(document.createTextNode(t));
    });
    f2.appendChild(fill2);
    if (fc.auto) f2.appendChild(el("div", "c-field-auto", fc.auto));
    row.appendChild(f2);
    return row;
  }

  /** 前後の句の縮小表示（薄い一行）。label 例: "前の句（5–6小節）" は機械生成 */
  function neighborRow(unitId, prefix) {
    var u = phrase(unitId);
    var out = document.createDocumentFragment();
    var extra = [];
    if (u.bars) extra.push(barsLabel(u));
    if (!notesOf(u) && u.kind === "phrase" && u.words) extra.push("メロなし");
    if (notesOf(u) && !u.words && !u.noLyric) extra.push("詞の空き");
    out.appendChild(el("div", "c-ghostlbl", prefix + "（" + extra.join("・") + "）"));
    var row = el("div", "c-ku c-ghost c-noline");
    row.setAttribute("data-phrase", unitId);
    row.appendChild(notesOf(u) ? melo(unitId) : meloNone());
    if (u.words) {
      var ly = el("div", "c-ly c-ly-s");
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + unitId);
      ly.appendChild(sp);
      row.appendChild(ly);
    } else if (notesOf(u) && !u.noLyric) {
      row.appendChild(timeRow(unitId, "slots"));
    }
    out.appendChild(row);
    return out;
  }

  /** 対応句の参照行（同じメロの1番側の句・読み取り専用）。 */
  function refRow(unitId) {
    var u = phrase(unitId);
    if (!u.sameAs) throw new Error(unitId + " に sameAs が無い（対応句参照は同じメロの句だけ）");
    var refU = phrase(u.sameAs);
    var refSec = section(refU.section);
    var out = document.createDocumentFragment();
    out.appendChild(el("div", "c-ghostlbl", "対応する句（同じメロ）: " + refSec.name + " " + barsLabel(refU) + "（読み取り専用）"));
    var row = el("div", "c-ku c-refrow c-noline");
    row.setAttribute("data-phrase", u.sameAs);
    row.appendChild(melo(u.sameAs));
    var ly = el("div", "c-ly c-ly-s");
    if (refU.words) {
      var sp = el("span", null, displayText(refU));
      sp.setAttribute("data-src", "lyric:" + u.sameAs);
      ly.appendChild(sp);
    }
    row.appendChild(ly);
    out.appendChild(row);

  /** 操作ボタン列。labels: [{t, main:true}] or 文字列 */
  function ops(labels) {
    var r = el("div", "c-ops");
    labels.forEach(function (x) {
      var t = typeof x === "string" ? x : x.t;
      var s = el("span", "c-op" + (x && x.main ? " c-op-main" : ""), t);
      r.appendChild(s);

  /* ---------------- 候補 ---------------- */

  /** 候補カード（詞候補・メロ候補共用）。バッジは marks.js から機械生成。 */
  function candidateCard(candId) {
    var c = cand(candId);
    var tgt = phrase(c.target);
    var card = el("div", "c-cand");
    card.setAttribute("data-cand", candId);
    var badges;
    if (c.word) {
      var w = el("div", "c-cand-w", c.word);
      w.setAttribute("data-src", "cand:" + candId);
      card.appendChild(w);
      var slotYs = slotIdxs(tgt).map(function (i) { return notesOf(tgt)[i].y; });
      badges = M.lyricCandBadges(c, slotYs, currentOpts());
    } else {
      var mini = el("div", "c-cand-mel");
      var vw = LAYOUT.TIME_W;
      var svg = sv("svg", { width: 220, height: 20, viewBox: "0 0 " + vw + " " + LAYOUT.MELO_H });
      c.notes.forEach(function (n) {
        svg.appendChild(sv("rect", { class: "c-nt", x: n.x, y: n.y, width: n.w, height: LAYOUT.MELO_NOTE_H, rx: 1.5 }));
      });
      mini.appendChild(svg);
      card.appendChild(mini);
      badges = M.melodyCandBadges(c.notes, tgt.accent, currentOpts());
    }
    var facts = el("div", "c-cand-facts");
    badges.forEach(function (b) {
      var f = el("span", "c-fact" + (b.tone ? " c-fact-" + b.tone : ""), b.t);
      f.setAttribute("data-src", "badge:" + candId);
      facts.appendChild(f);
    });
    card.appendChild(facts);
    var dest = el("div", "c-cand-dest", destLabel(tgt));
    dest.setAttribute("data-src", "dest:" + candId);
    card.appendChild(dest);
    return card;
  }

  /** 候補シート。mode: "order"（合いそうな順・点数なし） | "group"（事実で区分） */
  function candidateSheet(candIds, mode) {
    var sh = el("div", "c-sheet");
    var h = el("h3", null, "候補");
    h.appendChild(el("span", "c-sheet-mode",
      mode === "group" ? "事実で区分（区分の中の並びに意味は持たせない）" : "合いそうなものから順に（点数は出さない）"));
    sh.appendChild(h);
    if (mode !== "group") {
      candIds.forEach(function (id) { sh.appendChild(candidateCard(id)); });
      return sh;
    }
    /* 事実で区分＝バッジから機械で見出しを立てる */
    var groups = {};
    var order = [];
    candIds.forEach(function (id) {
      var c = cand(id);
      var tgt = phrase(c.target);
      var badges = c.word
        ? M.lyricCandBadges(c, slotIdxs(tgt).map(function (i) { return notesOf(tgt)[i].y; }), currentOpts())
        : M.melodyCandBadges(c.notes, tgt.accent, currentOpts());
      var key;
      if (badges.some(function (b) { return b.tone === "r"; })) key = "読みの高低が逆";
      else if (badges.some(function (b) { return b.tone === "y"; })) key = badges.filter(function (b) { return b.tone === "y"; })[0].t.replace(/ \d+$/, function (m2) { return m2; });
      else key = "音数ぴったり・読みの高低も合う";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(id);
    });
    order.forEach(function (k) {
      sh.appendChild(el("div", "c-cgroup", k));
      groups[k].forEach(function (id) { sh.appendChild(candidateCard(id)); });
    });
    return sh;
  }

  /** 候補依頼フォーム（条件の付け外し）。conds: 使う条件のキー配列。
   *  キー: "word"(使いたい語)・"onsu"(音数)・"hl"(読みの高低)・"imi"(意味) 。
   *  values はデータ参照で埋める（例: 句の意味・音の枠から）。空配列＝条件なしで頼む。 */
  function requestForm(unitId, conds) {
    var u = phrase(unitId);
    var box = el("div", "c-reqform");
    box.appendChild(el("h3", null, "候補を頼む"));
    var defs = {
      word: { label: "使いたい語（任意）", value: "" },
      onsu: { label: "音数（任意）", value: "" },
      hl: { label: "読みの高低（任意）", value: "" },
      imi: { label: "意味（任意）", value: u.imi || "" },
    };
    var ns = notesOf(u);
    if (ns && slotIdxs(u).length) {
      var ys = slotIdxs(u).map(function (i) { return ns[i].y; });
      defs.onsu.value = String(slotIdxs(u).length);
      defs.hl.value = M.hlText(M.slotSuggestHL(ys));
    } else if (!ns && u.accent) {
      defs.onsu.value = String(u.accent.moras.length);
      defs.hl.value = M.hlText(u.accent.hl);
    }
    (conds || []).forEach(function (k) {
      var d = defs[k];
      if (!d) throw new Error("候補依頼フォームの条件キーが不明: " + k);
      var row = el("div", "c-formrow");
      var lb = el("label", null, d.label);
      row.appendChild(lb);
      var fin = el("span", "c-fin", d.value);
      if (k === "imi" && d.value) fin.setAttribute("data-src", "imi:" + unitId);
      if ((k === "hl" || k === "onsu") && d.value) fin.setAttribute("data-src", "frame:" + unitId);
      row.appendChild(fin);
      row.appendChild(el("span", "c-cond-x", "×"));
      box.appendChild(row);
    });
    if (!conds || !conds.length) box.appendChild(el("div", "c-req-empty", "条件なしで頼む（自由に出してもらう）"));
    var foot = el("div", "c-pop");
    foot.appendChild(el("span", "c-pop-p1", "頼む"));
    foot.appendChild(el("span", null, "条件を足す"));
    foot.appendChild(el("span", null, "やめる"));
    box.appendChild(foot);
    return box;
  }

  /** 予定の記入フォーム（メモ・小節数・音数・読みの高低。すべて任意）。
   *  planId を渡せばその予定の値を欄に写す。null なら空フォーム。 */
  function planForm(planId) {
    var plan = planId ? D.planById[planId] : null;
    if (planId && !plan) throw new Error("予定がない: " + planId);
    var box = el("div", "c-planform");
    var rows = [
      ["メモ（任意）", plan && plan.memo, false],
      ["小節数（任意）", plan && plan.bars, true],
      ["音数（任意）", plan && plan.onsu, true],
      ["読みの高低（任意）", plan && plan.hl, true],
    ];
    rows.forEach(function (r) {
      var row = el("div", "c-formrow");
      row.appendChild(el("label", null, r[0]));
      var fin = el("span", "c-fin" + (r[2] ? " c-fin-s" : ""), r[1] || "");
      if (r[1] && plan) fin.setAttribute("data-src", "plan:" + plan.id);
      row.appendChild(fin);
      box.appendChild(row);
    });
    var foot = el("div", "c-pop");
    foot.appendChild(el("span", "c-pop-p1", "置く"));
    foot.appendChild(el("span", null, "やめる"));
    box.appendChild(foot);
    return box;
  }

  /** 空きの枠のその場入力（通しの面・枠がそのまま入力欄になる小さな絵） */
  function slotInput(unitId) {
    var u = phrase(unitId);
    var row = el("div", "c-ku c-noline");
    row.setAttribute("data-phrase", unitId);
    var ly = el("div", "c-ly");
    if (u.words) {
      var sp = el("span", null, displayText(u));
      sp.setAttribute("data-src", "lyric:" + unitId);
      ly.appendChild(sp);
    }
    var slots = slotIdxs(u);
    var inp = el("span", "c-inp");
    inp.appendChild(document.createTextNode(slots.length + "音"));
    inp.appendChild(el("i", null, "｜"));
    ly.appendChild(inp);
    var pop = el("span", "c-pop");
    pop.appendChild(el("span", "c-pop-p1", "候補を探す"));
    pop.appendChild(el("span", null, "編集画面で開く"));
    ly.appendChild(pop);
    row.appendChild(ly);
    return row;
  }

  /** 通しの面の操作の割当の注記（データの文字列をそのまま出す。書き換え禁止） */
  function opsTableNote() {
    var d = el("div", "c-opstable");
    d.setAttribute("data-ops-table", "1");
    d.textContent = D.opsTableText;
    return d;
  }

  /** 枚7用: セクションの事実の小札（数値は全てデータから機械算出）。
   *  数え方の定義（この関数が正）:
   *   詞の空き   = 空きの枠のある句＋詞があるのに予定（続きの当て）が付いている句
   *   詞なし     = 意図して詞を付けない句（noLyric）
   *   メロ未定   = 帯が句の一部にしか無い句（band指定）＋モーラ数より音符が少ない句
   *   メロの空き = 詞があるのに音符列が無い句
   *   まだ何も無い = zone の数 */
  function sectionFactChips(secId) {
    var s = section(secId);
    var facts = [];
    var lyGap = 0, meloNone2 = 0, meloPart = 0, noLy = 0, zones = 0;
    (s.units || []).forEach(function (u) {
      if (u.kind === "zone") { zones++; return; }
      var ns = notesOf(u);
      if (!u.noLyric && ((ns && slotIdxs(u).length) || (u.words && u.plan))) lyGap++;
      if (ns && (u.band || (u.words && morasOf(u).length > ns.length))) meloPart++;
      if (!ns && u.words) meloNone2++;
      if (u.noLyric) noLy++;
    });
    if (lyGap) facts.push("詞の空き " + lyGap + "か所");
    if (noLy) facts.push("詞なし " + noLy + "範囲");
    if (meloPart) facts.push("メロ未定 " + meloPart + "範囲");
    if (meloNone2) facts.push("メロの空き " + meloNone2 + "句");
    if (zones) facts.push("まだ何も無い " + zones + "区間");
    var wrap = el("div", "c-cfacts");
    facts.forEach(function (t) {
      var f = el("span", "c-fact", t);
      f.setAttribute("data-calc", "secfacts:" + secId);
      wrap.appendChild(f);
    });
    return wrap;
  }

  /** 判定用の説明（枠外・配布スクショでは非表示になる）。設計論はここにだけ書いてよい */
  function desc(text) {
    var d = el("div", "desc");
    d.textContent = text;
    return d;
  }
  /** 枚の中の補助パネル（インセット） */
  function inset(title, children) {
    var d = el("div", "c-inset");
    d.appendChild(el("h3", null, title));
    (children || []).forEach(function (c) { d.appendChild(c); });
    return d;
  }

  g.V7C = {
    LAYOUT: LAYOUT,
    registerSheet: registerSheet,
    renderAll: renderAll,
    sheets: sheets,
    /* データ読み出し */
    phrase: phrase, section: section, cand: cand,
    notesOf: notesOf, morasOf: morasOf, ysOf: ysOf, slotIdxs: slotIdxs,
    displayText: displayText, barsLabel: barsLabel, marksOf: marksOf,
    planChipText: planChipText, frameFieldContent: frameFieldContent,
    /* 部品 */
    phone: phone, playbar: playbar, legendText: legendText,
    melo: melo, meloNone: meloNone, lyricLine: lyricLine, planChip: planChip,
    timeRow: timeRow, phraseRow: phraseRow, sectionHead: sectionHead,
    zoneRow: zoneRow, stockRow: stockRow, stockHead: stockHead, addRow: addRow,
    prFragment: prFragment, prCaption: prCaption, hlRow: hlRow, hlLabel: hlLabel,
    fieldPair: fieldPair, neighborRow: neighborRow, refRow: refRow, ops: ops,
    candidateCard: candidateCard, candidateSheet: candidateSheet,
    requestForm: requestForm, planForm: planForm, slotInput: slotInput,
    opsTableNote: opsTableNote, sectionFactChips: sectionFactChips,
    desc: desc, inset: inset,
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* ===== sheet-bon.js ===== */
/* sheet-bon.js — （新）枚: 歌詞全体画面・表示切替（音韻）。枚2と対。
 * 作法は枚2と同じ（文字の時間揃え＋文字への付け足しの印）。中身は母音・韻の対応:
 *  - 各音の下に小さく母音（a i u e o。ん・っ・ーはそのまま）＝機械導出（かな→母音の表）。
 *  - 句のおわり2音の母音が同じ句どうしを同じ色の下線で結ぶ（韻とみた根拠を絵に出す）。
 * 歌詞・モーラの文字列は全てデータ由来（部品が置いた文字に付け足すだけ。文字は書き換えない）。 */
V7C.registerSheet({
  id: "bon",
  no: 3,
  title: "歌詞全体画面・表示切替（音韻）",
  wide: false,
  marksOpts: { flatPair: "ア", yellowUse: "B" },
  css: [
    ".bon-vrow{position:relative;height:13px;margin-top:1px}",
    ".bon-vc{position:absolute;top:0;text-align:center;font-size:9px;color:#6d7480;font-family:ui-monospace,SFMono-Regular,monospace}",
    ".bon-rh0{color:#7fd6a8;border-bottom:2px solid #3d8f6b;font-weight:700}",
    ".bon-rha{color:#7fd6a8;border-bottom:2px solid #3d8f6b}",
    ".bon-sum{font-size:10.5px;color:#8fb8a8;border:1px solid #3d5a4f;border-radius:8px;padding:5px 8px;margin:12px 0 2px;line-height:1.6}",
    ".bon-note{font-size:10.5px;color:#9aa0aa;margin:10px 2px 2px;line-height:1.6}",
  ].join("\n"),
  build(root) {
    const C = V7C;

    /* かな→母音（機械導出の表。表示データではなく既存モーラ列への注記） */
    const VMAP = {
      a: "あかがさざただなはばぱまやらわゃアカガサザタダナハバパマヤラワャ",
      i: "いきぎしじちぢにひびぴみりイキギシジチヂニヒビピミリ",
      u: "うくぐすずつづぬふぶぷむゆるゅウクグスズツヅヌフブプムユルュ",
      e: "えけげせぜてでねへべぺめれエケゲセゼテデネヘベペメレ",
      o: "おこごそぞとどのほぼぽもよろをょオコゴソゾトドノホボポモヨロヲョ",
    };
    function vowelOf(mora) {
      const c = mora[mora.length - 1];
      if (c === "ん" || c === "ン") return "ん";
      if (c === "っ" || c === "ッ") return "っ";
      if (c === "ー") return "ー";
      for (const k in VMAP) if (VMAP[k].indexOf(c) >= 0) return k;
      return "?";
    }

    /* 韻のグループ分け（機械）: 句のおわり2音の母音が同じ句どうし（2句以上そろったものだけ） */
    const wordedIds = ["A-1A-k1", "A-1A-k2", "A-1A-k3", "A-1A-k4", "A-1B-k1", "A-1S-k1"];
    const tails = {};
    wordedIds.forEach((id) => {
      const u = C.phrase(id);
      if (!u.accent || u.accent.moras.length < 2) return;
      const key = u.accent.moras.slice(-2).map(vowelOf).join("-");
      (tails[key] = tails[key] || []).push(id);
    });
    const rhymeIds = {};
    let groupKey = null;
    for (const k in tails) {
      if (tails[k].length >= 2 && /^[aiueo]-[aiueo]$/.test(k)) {
        groupKey = k;
        tails[k].forEach((id) => { rhymeIds[id] = k; });
        break; /* この絵ではグループは1つ（増えたら色を足す） */
      }
    }

    /* 句の行に母音の段を足し、韻の該当音に下線を付ける */
    function decorated(unitId) {
      const row = C.phraseRow(unitId, "into");
      const u = C.phrase(unitId);
      if (!u.accent) return row;
      const m = u.accent.moras.length;
      const inRhyme = (i) => rhymeIds[unitId] && i >= m - 2;
      const fr = row.querySelector(".c-fr");
      if (fr) {
        const vr = document.createElement("div");
        vr.className = "bon-vrow";
        fr.querySelectorAll(".c-tc[data-nc]").forEach((tc) => {
          const idx = +tc.getAttribute("data-nc").split(":")[1];
          const s = document.createElement("span");
          s.className = "bon-vc" + (inRhyme(idx) ? " bon-rh0" : "");
          s.textContent = vowelOf(u.accent.moras[idx]);
          s.style.left = tc.style.left;
          s.style.width = tc.style.width;
          vr.appendChild(s);
        });
        row.querySelector(".c-kmain").appendChild(vr);
        /* メロ未定の続き（時間の基準が無い文字）に韻が落ちる句は、その文字側に下線を付ける */
        const after = fr.querySelector(".c-fr-after");
        if (after && rhymeIds[unitId]) {
          const text = after.textContent;
          const tail = u.accent.moras.slice(-2).join("");
          if (text.length > tail.length && text.slice(-tail.length) === tail) {
            after.textContent = "";
            after.appendChild(document.createTextNode(text.slice(0, -tail.length)));
            const sp = document.createElement("span");
            sp.className = "bon-rha";
            sp.textContent = tail;
            after.appendChild(sp);
          }
        }
      }
      return row;
    }

    const note = document.createElement("div");
    note.className = "bon-note";
    note.textContent = "（ここから下の並びは素の表示と同じ。母音の段と韻の下線だけが替わる）";

    /* 韻とみた根拠の要約（文字列は全てデータのモーラ列から機械で切り出す） */
    let sum = null;
    if (groupKey) {
      sum = document.createElement("div");
      sum.className = "bon-sum";
      const parts = tails[groupKey].map((id) => "…" + C.phrase(id).accent.moras.slice(-3).join(""));
      sum.textContent = "韻とみた根拠 — 句のおわり2音の母音が「" + groupKey + "」でそろう: " + parts.join(" ／ ");
    }

    root.appendChild(C.phone(
      {
        title: "サンプル曲（サンプルEP）",
        tab: "音韻",
        legend: "各音の下の小さい字＝読みの母音（a i u e o。ん・っ・ーはそのまま）。緑の下線＝句のおわり2音の母音が同じ句どうし（韻）。赤＝アクセント逆行（表示切替に共通）",
      },
      [
        C.sectionHead("A-intro"),
        C.sectionHead("A-1A"),
        decorated("A-1A-k1"),
        decorated("A-1A-k2"),
        decorated("A-1A-k3"),
        decorated("A-1A-k4"),
        C.sectionHead("A-1B"),
        decorated("A-1B-k1"),
        C.phraseRow("A-1B-k2", "into"),
        C.zoneRow("A-1B-z1"),
        C.sectionHead("A-1S"),
        decorated("A-1S-k1"),
        sum || document.createTextNode(""),
        note,
      ]
    ));

    root.appendChild(C.desc(
      "枚3（新設）＝音韻タブの選択状態＝欠陥5の1案（目視裁定に回す）。枚2と同じ作法＝文字の時間揃え＋" +
      "文字への付け足しの印。母音は かな→母音 の機械導出、韻の対応は「句のおわり2音の母音が同じ」" +
      "の機械規則で、根拠（母音の段と要約の札）が絵から読める。メロ未定の続きに韻が落ちる句" +
      "（かぎをかけて…でる）は文字側に下線。印の宣言は案ア+案B＝逆行の赤だけが共通で出る。"
    ));
  },
});

<script>
/* ===== sheet-m7.js ===== */
/* sheet-m7.js — 枚7: 既存画面への足し込み（担当D）。
 * 左=曲画面（セクションカードに欠けの小札・「歌詞」ボタンを足す）
 * 右=PianoRoll（「歌詞で見る」ボタンを足す。赤黄の印は既存機能・規則関数から導出）。
 * 小札の数値は全て V7C.sectionFactChips / V7C.slotIdxs のデータ算出。手書きの数値は無い。 */
V7C.registerSheet({
  id: "m7",
  no: 11,
  title: "既存画面への足し込み",
  wide: true,
  marksOpts: { flatPair: "ア", yellowUse: "B" },
  css: [
    ".m7-cols{display:flex;gap:24px;align-items:flex-start}",
    ".m7-panel{flex:0 0 auto}",
    ".m7-pcap{font-size:11px;color:#9aa0aa;margin:0 0 6px 2px;max-width:352px}",
    ".m7-card{display:flex;align-items:flex-start;gap:7px;background:#22252b;border:1px solid #33373f;border-left:3px solid #4a5160;border-radius:9px;padding:7px 9px;margin:0 0 6px}",
    ".m7-card-kari{border-style:dashed;border-left-style:dashed;background:#1c1f25}",
    ".m7-cmain{min-width:0}",
    ".m7-cname{font-weight:600;font-size:13px;white-space:nowrap}",
    ".m7-cbars{color:#9aa0aa;font-size:11px;margin-top:1px}",
    ".m7-block{display:flex;align-items:center;gap:6px;border:1px solid #2e4a5e;background:#182028;border-radius:9px;padding:6px 9px;margin:-2px 0 6px 14px;font-size:12px}",
    ".m7-bkind{font-size:10px;color:#7fc0e8;border:1px solid #2e4a5e;border-radius:6px;padding:0 5px;flex:none}",
    ".m7-chip{margin-left:auto;font-size:9.5px;color:#9aa0aa;border:1px solid #33373f;border-radius:7px;padding:0 5px;white-space:nowrap}",
    ".m7-prosody{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11px;color:#e6e8ec;margin:2px 2px 8px}",
    ".m7-prosody i{font-style:normal;font-size:10px;color:#9aa0aa}",
    ".m7-r{color:#e8533f}",
    ".m7-y{color:#e0a83c}",
    ".m7-note{font-size:10px;color:#6d7480;margin-top:6px;line-height:1.6}",
  ].join("\n"),
  build(root) {
    const C = V7C, D = V7DATA;
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    /* ---- 左: 曲画面（セクションカード＋置かれたメロのブロック） ---- */
    function sectionCard(s) {
      const card = el("div", "m7-card" + (s.kari ? " m7-card-kari" : ""));
      const main = el("div", "m7-cmain");
      const nm = el("div", "m7-cname", s.name);
      if (s.kari) {
        nm.appendChild(document.createTextNode(" "));
        nm.appendChild(el("span", "c-karichip", "仮"));
      }
      main.appendChild(nm);
      let barsTxt = s.bars
        ? (s.bars[1] - s.bars[0] + 1) + "小節・" + s.bars[0] + "–" + s.bars[1]
        : (s.barsText || "");
      if (s.noSing) barsTxt += "（歌なし）";
      main.appendChild(el("div", "m7-cbars", barsTxt));
      card.appendChild(main);
      card.appendChild(C.sectionFactChips(s.id)); // 小札=データからの機械算出（data-calc付き）
      return card;
    }
    /* 置かれたメロのブロック（曲画面に既存の表示）。空きの数はデータから算出 */
    function meloBlock(id) {
      const u = C.phrase(id);
      const row = el("div", "m7-block");
      row.setAttribute("data-phrase", id);
      row.appendChild(el("span", "m7-bkind", "メロ"));
      const t = el("span", null);
      t.appendChild(document.createTextNode("「"));
      const w = el("span", null, C.displayText(u));
      w.setAttribute("data-src", "lyric:" + id);
      t.appendChild(w);
      t.appendChild(document.createTextNode("」"));
      row.appendChild(t);
      row.appendChild(el("span", "m7-chip", "詞の空き " + C.slotIdxs(u).length + "音"));
      return row;
    }

    const leftKids = [];
    D.songs.A.sections.forEach(function (s) {
      leftKids.push(sectionCard(s));
      if (s.id === "A-1A") leftKids.push(meloBlock("A-1A-k2"));
    });
    leftKids.push(C.addRow(["＋ セクションを足す"]));

    const leftPanel = el("div", "m7-panel");
    leftPanel.appendChild(el("div", "m7-pcap",
      "曲画面（既存）に足すもの＝右上の「歌詞」ボタンと、各セクションの欠けの小札。数はいま置いてある詞とメロから数える"));
    leftPanel.appendChild(C.phone(
      { title: D.songs.A.title, headBtn: "歌詞" },
      leftKids
    ));

    /* ---- 右: PianoRoll（「歌詞で見る」を足す。印は規則関数から） ---- */
    const prId = "A-1B-k1";
    const u = C.phrase(prId);
    const sec = C.section(u.section);
    const prTitle = sec.name + " " + C.barsLabel(u);

    const prosody = el("div", "m7-prosody");
    prosody.appendChild(el("span", null, "☑ 韻律チェック"));
    prosody.appendChild(el("i", "m7-r", "赤=アクセント逆行"));
    prosody.appendChild(el("i", "m7-y", "黄=注意"));
    prosody.appendChild(el("i", null, "印なし=指摘なし"));

    const rightPanel = el("div", "m7-panel");
    rightPanel.appendChild(el("div", "m7-pcap",
      "PianoRoll（既存）に足すもの＝右上の「歌詞で見る」ボタン。赤黄の印と詞モードは既存の機能のまま"));
    rightPanel.appendChild(C.phone(
      { title: prTitle, headBtn: "歌詞で見る" },
      [
        prosody,
        C.prFragment(prId),
        el("div", "m7-note", "印はどの画面でも同じ規則から出ます＝同じ句なら歌詞の画面と同じ音符に同じ印が付く"),
      ]
    ));

    const cols = el("div", "m7-cols");
    cols.appendChild(leftPanel);
    cols.appendChild(rightPanel);
    root.appendChild(cols);

    root.appendChild(C.desc(
      "枚11（v6の枚7）=既存画面への足し込み（生存＋修正）。v6の欠陥15（1番サビカードのメロの空きの数え漏れ）は、" +
      "小札を sectionFactChips のデータ算出に替えて解消（1番サビ=詞なし1範囲＋メロの空き1句が機械で出る）。" +
      "v6の欠陥（枚7だけ別の音符に印が付く食い違い）は、印を prFragment 経由の規則関数導出に替えて解消。" +
      "小節番号は前奏込みの通し（1番Aメロ=5–12。欠陥14の修正がカードにも見える）。案はア/B（既定）。"
    ));
  },
});

</script>

      ".cwide-write-n{margin-left:auto;color:var(--muted);font-size:10px}" +
      ".cwide-write-in{min-height:24px;border:1px solid #2c3a57;border-radius:7px;background:#10151f;padding:4px 8px;font-size:14px;color:#5c6577}" +
      ".cwide-write-in b{color:var(--fg);font-weight:400}",
    build: function (root) {
      var song = D.songs.A;
      var songName = song.title.replace(/（.*$/, "");

      /* ---- 上: セクションまるごと（1番Bメロ 8小節） ---- */
      var sec1 = C.section(C.phrase(FOCUS1).section);
      var secBars = sec1.bars[0] + "–" + sec1.bars[1] + "小節";
      var focus1 = el("div", "c-target");
      focus1.appendChild(C.prFragment(FOCUS1));
      focus1.appendChild(writeBox(FOCUS1));
      focus1.appendChild(C.fieldPair(FOCUS1));
      focus1.appendChild(C.ops([{ t: "候補を探す", main: true }, "この範囲は詞を付けない", "閉じる"]));
      root.appendChild(el("div", "cwide-cap", "セクションをまるごと開いたとき（範囲=" + secBars + "）"));
      root.appendChild(C.phone(
        { crumb: songName + " › " + sec1.name + " › " + secBars + "（セクション全体）", playbar: false },
        [
          rangeBar("範囲: " + sec1.name + "ぜんぶ（" + secBars + "）", "◀ のばす", "のばす ▶"),
          el("div", "c-ghostlbl", "範囲の中は句ごとの縮小表記。タップした句だけ実表記で開く"),
          C.phraseRow("A-1B-k1", "plain"),
          el("div", "c-ghostlbl", "開いている句（実表記）"),
          focus1,
          C.zoneRow("A-1B-z1"),
        ]
      ));

      root.appendChild(el("div", "cwide-gap"));

      /* ---- 下: 全部選択（曲全体）。並びは歌詞全体画面と同じ ---- */
      var maxBar = 0, kariCount = 0;
      song.sections.forEach(function (s) {
        if (s.bars && s.bars[1] > maxBar) maxBar = s.bars[1];
        if (s.kari) kariCount++;
      });
      var body = [
        rangeBar("範囲: 全体（1–" + maxBar + "小節と仮セクション" + kariCount + "つ）", "◀ これで端", "これで端 ▶"),
      ];
      song.sections.forEach(function (sec) {
        body.push(C.sectionHead(sec.id));
        (sec.units || []).forEach(function (u) {
          if (u.id === FOCUS2) {
            body.push(el("div", "c-ghostlbl", "開いている句（実表記）"));
            var t = el("div", "c-target");
            t.appendChild(C.prFragment(FOCUS2));
            t.appendChild(writeBox(FOCUS2));
            t.appendChild(C.ops([{ t: "候補を探す", main: true }, "閉じる"]));
            body.push(t);
          } else if (u.kind === "zone") {
            body.push(C.zoneRow(u.id));
          } else {
            body.push(C.phraseRow(u.id, "plain"));
          }
        });
      });
      body.push(C.stockHead());
      (song.stock || []).forEach(function (st) { body.push(C.stockRow(st.id)); });

      root.appendChild(el("div", "cwide-cap", "全部選択（範囲=曲全体）のとき"));
      root.appendChild(C.phone(
        {
          crumb: songName + " › 全体（全部選択）",
          tab: "素",
          legend: "範囲が全体のとき＝並びも表示切替も歌詞全体画面と同じ。開いている句だけ実表記で膨らむ。閉じればそのまま歌詞全体画面",
          playbar: true,
        },
        body
      ));

      root.appendChild(C.desc(
        "枚8（新設・欠陥12）＋「歌詞全体を見るときは全部選択かな？」への絵の答え。" +
        "答え=地続き（範囲に上限を置かない）。範囲を広げても画面は組み変わらず、句ごとの縮小表記の並びに" +
        "「開いている1句の実表記」が浮くだけ。全部選択では並び・表示切替・再生バーが歌詞全体画面と一致し、" +
        "候補・意味欄・断片は範囲全体ではなく開いている1句に付く＝曲全体でも成立が崩れない。" +
        "つまり場2は『通しの面＋開いた1句』であり、どこかで別画面に切り替わる境目は無い、という1案。" +
        "上の絵は8小節の空きセクションを1画面で扱う（裁定9の適用=選択中の句だけ実PianoRoll断片）。" +
        "覆すならここだとオーナーが予告済みの箇所。"
      ));
    },
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== sheet-cmel.js ===== */
/* sheet-cmel.js — 範囲の編集画面（メロ側の空き）＋メロ候補シート＋孤立。
 * v6枚6の生存＋追加: 「メロ候補を頼む」の先（候補の一覧と選んで置く操作）。
 * 孤立の例はデータ参照（refs.isolationExample）＝実在の予定を指す。 */
(function (g) {
  "use strict";
  var C = g.V7C, D = g.V7DATA;
  var KU = D.refs.melCandTarget; // "A-C-k2"（詞あり・メロなし）
  var MC = ["A-C-k2-mc1", "A-C-k2-mc2", "A-C-k2-mc3"];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function crumbOf(id) {
    var u = C.phrase(id), sec = C.section(u.section);
    return D.songs[u.song].title.replace(/（.*$/, "") + " › " + sec.name + " › " + C.barsLabel(u);
  }
  function rangeBar(center) {
    var r = el("div", "cmel-range");
    r.appendChild(el("span", "cmel-rh", "◀ のばす"));
    r.appendChild(el("span", "cmel-rc", center));
    r.appendChild(el("span", "cmel-rh", "のばす ▶"));
    return r;
  }
  function isoRow(lab, inner) {
    var row = el("div", "cmel-isorow");
    row.appendChild(el("span", "cmel-isolab", lab));
    var body = el("div", "cmel-isobody");
    body.appendChild(inner);
    row.appendChild(body);
    return row;
  }

  C.registerSheet({
    id: "cmel",
    no: 9,
    title: "範囲の編集画面（メロ側の空き・メロ候補・孤立）",
    wide: false,
    demo: false,
    marksOpts: { flatPair: "ア", yellowUse: "B" },
    css: "" +
      ".cmel-range{display:flex;align-items:center;gap:7px;margin:0 0 6px}" +
      ".cmel-rh{font-size:10px;color:var(--muted);border:1px dashed #565d69;border-radius:7px;padding:2px 7px;white-space:nowrap}" +
      ".cmel-rc{flex:1;text-align:center;font-size:11px;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:2px 4px;background:var(--card);white-space:nowrap;overflow:hidden}" +
      ".cmel-cap{font-size:12px;color:var(--fg);font-weight:600;margin:0 2px 6px}" +
      ".cmel-gap{height:22px}" +
      ".cmel-pick{outline:2px solid var(--accent);outline-offset:-1px}" +
      ".cmel-note{font-size:9.5px;color:#6d7480;margin-top:3px}" +
      ".cmel-isorow{display:flex;gap:7px;align-items:stretch;margin:6px 0}" +
      ".cmel-isolab{flex:none;width:30px;font-size:10px;color:var(--muted);display:flex;align-items:center}" +
      ".cmel-isobody{flex:1;min-width:0}" +
      ".cmel-none{border:1px dashed #3c414a;border-radius:9px;padding:10px 10px;color:#565d69;font-size:11px}",
    build: function (root) {
      /* ---- 上: メロ側の空きの句＋メロ候補シート ---- */
      var t = el("div", "c-target");
      t.appendChild(C.prFragment(KU)); // メロなし＝「まだメロがありません」
      t.appendChild(C.hlLabel());
      t.appendChild(C.hlRow(KU));      // 詞から読みの高低は見える（等間隔）
      t.appendChild(C.fieldPair(KU));

      var sheet = C.candidateSheet(MC, "order");
      var cards = sheet.querySelectorAll(".c-cand");
      MC.forEach(function (id, i) {
        if (C.cand(id).genNote) cards[i].appendChild(el("div", "cmel-note", C.cand(id).genNote));
      });
      cards[0].classList.add("cmel-pick");

      root.appendChild(el("div", "cmel-cap", "メロ側が空きの句を開いたとき"));
      root.appendChild(C.phone(
        { crumb: crumbOf(KU), playbar: false },
        [
          rangeBar("範囲: " + C.barsLabel(C.phrase(KU)) + "の句"),
          C.neighborRow("A-C-k1", "前の句"),
          t,
          C.neighborRow("A-C-k3", "次の句"),
          C.ops([{ t: "メロ候補を頼む", main: true }, "ピアノロールで置く", "配置を開く", "相談"]),
          sheet,
          el("div", "c-ghostlbl", "選んでいる候補に枠が付く。置いたあとも「戻す」で取り消せる"),
          C.ops([{ t: "この並びで置く", main: true }, "ほかを頼む", "やめる"]),
        ]
      ));

      root.appendChild(el("div", "cmel-gap"));

      /* ---- 下: 孤立（前後とも何も無い場所を開いたとき）。指し先はデータ参照 ---- */
      var iso = D.planById[D.refs.isolationExample]; // 実在の予定
      var zoneId = iso.owner;                        // その予定が付いた区間
      var zsec = C.section(C.phrase(zoneId).section);
      var t2 = el("div", "c-target");
      t2.appendChild(C.zoneRow(zoneId));
      t2.appendChild(C.fieldPair(zoneId));
      root.appendChild(el("div", "cmel-cap", "まだ何も無い場所をひとつだけ開いたとき（前後も無い）"));
      root.appendChild(C.phone(
        { crumb: D.songs[C.phrase(zoneId).song].title.replace(/（.*$/, "") + " › " + zsec.name + (zsec.kari ? "（仮）" : ""), playbar: false },
        [
          isoRow("前", el("div", "cmel-none", "まだ何も無い")),
          isoRow("対象", t2),
          isoRow("あと", el("div", "cmel-none", "まだ何も無い")),
          el("div", "c-ghostlbl", "前後が空であることが、そのまま表示になる（特別な名札は付けない）"),
          C.ops(["予定を直す", "句を足す", { t: "候補を頼む", main: true }, "相談"]),
        ]
      ));

      root.appendChild(C.desc(
        "枚9（v6の枚6の生存＋修正）。欠陥4=「メロ候補を頼む」の先＝候補シート（矩形表記＋機械バッジ。" +
        "沿う/逆行は事実表示であり保証ではない＝二段DP不採用の既決に沿う）。選んで置く→戻すも明示。" +
        "欠陥16=孤立例の指し先を refs.isolationExample（大サビ（仮）の実在の予定）に修正。" +
        "genNote（各候補の作り方の説明）はデータにあるが candidateCard が表示しないため手で追記＝正規経路を工程0へ依頼。"
      ));
    },
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== sheet-creq.js ===== */
/* sheet-creq.js — 候補を頼むときの条件の付け外し（発散側の絵）。新設。
 * 条件をぜんぶ付ける／意味だけ／音数だけ／条件なし、の同じフォームの4態＋
 * 詞もメロもまだ無い場所で条件（読みの高低・使いたい語）を自分で置ける形。 */
(function (g) {
  "use strict";
  var C = g.V7C, D = g.V7DATA;
  var KU = D.refs.lyrCandTarget; // "A-1A-k2"（詞の空き3音）

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function crumbOf(id) {
    var u = C.phrase(id), sec = C.section(u.section);
    return D.songs[u.song].title.replace(/（.*$/, "") + " › " + sec.name + " › " + C.barsLabel(u);
  }

  C.registerSheet({
    id: "creq",
    no: 10,
    title: "候補を頼むとき（条件の付け外し）",
    wide: false,
    demo: false,
    marksOpts: { flatPair: "ア", yellowUse: "B" },
    css: "",
    build: function (root) {
      root.appendChild(C.phone(
        { crumb: crumbOf(KU), playbar: false },
        [
          el("div", "c-ghostlbl", "条件は右の×で1つずつ外せる。全部外して頼むこともできる（同じフォームの4つの姿）"),
          C.inset("条件をぜんぶ付けて頼む", [C.requestForm(KU, ["word", "onsu", "hl", "imi"])]),
          C.inset("意味だけで頼む", [C.requestForm(KU, ["imi"])]),
          C.inset("音数だけで頼む", [C.requestForm(KU, ["onsu"])]),
          C.inset("条件なしで頼む", [C.requestForm(KU, [])]),
          C.inset("詞もメロもまだ無い場所（" + crumbOf("A-1S-k4").replace(/^[^›]*› /, "") + "）で頼む＝条件は自分で書ける",
            [C.requestForm("A-1S-k4", ["word", "onsu", "hl"])]),
        ]
      ));
      root.appendChild(C.desc(
        "枚10（新設・欠陥6・10）。発散の裁定材料＝条件を減らした候補依頼と既存の相談で「双方あるのが良い」の" +
        "発散側と呼べるかを仰ぐ。音数・読みの高低の初期値は音の枠から機械で写り、×で外せる。" +
        "「使いたい語（任意）」＝『通り過ぎる』型パズルの入口・「読みの高低（任意）」＝メロ未定でも" +
        "アクセントを条件に置ける欄（すべて任意＝裁定6の形式）。最下段はメロも詞も無い句（予定だけ）での姿。"
      ));
    },
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>V7C.renderAll(document.getElementById("frames"));</script>
